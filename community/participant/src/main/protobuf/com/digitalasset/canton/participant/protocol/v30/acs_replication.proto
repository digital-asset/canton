syntax = "proto3";

package com.digitalasset.canton.participant.protocol.v30;

import "com/digitalasset/canton/admin/participant/v30/active_contract.proto";
import "com/digitalasset/canton/crypto/v30/crypto.proto";
import "com/digitalasset/canton/protocol/v30/topology.proto";
import "google/protobuf/timestamp.proto";
import "scalapb/scalapb.proto";

// The PartyReplicationStatus describes the various pieces of state of a party replication.
message AcsReplicationStatus {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";

  // Static parameters that do not change throughout a single ACS replication operation.
  // TODO(#35267) Use this in the replication status endpoint
  message AcsReplicationParameters {
    string request_id = 1;
    string party_id = 2;
    string synchronizer_id = 3;
    string source_participant_uid = 4;
    string target_participant_uid = 5;
    // TODO(#35267): doesn't apply to other use cases without onboarding topology tx, should be replaced with a timestamp
    uint32 topology_serial = 6;
    google.protobuf.Timestamp timestamp = 7;
    com.digitalasset.canton.protocol.v30.Enums.ParticipantPermission participant_permission = 8;
  }

  // Sequencer channel agreement hasn't been proposed by target participant yet.
  message AgreementNotProposed {}

  // Sequencer channel agreement has been proposed by target participant but not yet accepted by source participant.
  message AgreementProposed {}

  // Agreement among participants to replicate the ACS via sequencer channel.
  message AgreementExists {
    // Daml admin workflow ACS replication contract id.
    // required
    string contract_id = 1;

    // Agreement time as determined by the record time of the Daml admin workflow agreement.
    // required
    google.protobuf.Timestamp agreed_at = 2;

    // Sequencer hosting the channel for ACS replication.
    string sequencer_uid = 3;
  }

  // Sequencer channel agreement is not needed either because the ACS replication has been finished or it's file-based.
  message AgreementNotNeeded {}

  message AgreementArchived {}

  // Progress of ACS replication.
  message AcsReplicationProgress {
    // Non negative running total (odometer)  of ACS contracts sent by the source or persisted by the target participant.
    // required
    uint64 processed_contract_count = 1;
    // The next counter to use for persistence on the target participant
    // required, not used and always -1 on the source participant
    uint64 next_persistence_counter = 2;
    // Whether replication has been fully processed the ACS.
    // required
    bool fully_processed_acs = 3;
  }

  // Error message when disconnected or operator intervention needed.
  message AcsReplicationError {
    enum ErrorType {
      ERROR_TYPE_UNSPECIFIED = 0;
      // Adding the party has failed and operator intervention may be needed.
      ERROR_TYPE_FAILED = 2;
      // Adding the party is encountering connectivity issues and is expected
      // to proceed once reconnected.
      ERROR_TYPE_DISCONNECTED = 3;
    }

    // Error code indicating whether add party is proceeding or stuck.
    // required
    ErrorType error_type = 1;

    // Error message.
    // required
    string error_message = 2;
  }

  // Static ACS replication parameters.
  // required
  AcsReplicationParameters parameters = 1;
  // Sequencer channel agreement.
  // optional, set if there is an agreement to replicate the ACS via sequencer channel.
  oneof agreement_status {
    AgreementNotProposed not_proposed = 2;
    AgreementProposed proposed = 3;
    AgreementExists exists = 4;
    AgreementNotNeeded not_needed = 5; // TODO(#35267) probably not needed this because a sequencer channel is always needed
    AgreementArchived archived = 6;
  }
  // TODO (#35267) add a timestamp to replace topology authorization in PartyReplicationStatus
  // I can use ProtoTimestamp which can be obtained from CantonTimestamp
  // Then I can use ledgerApiStore.lastSynchronizerOffset...
  // Or we could just pass offset as long and it's up to client to provide it (maybe that's the best)
  // ACS replication progress.
  // optional, set once the ACS replication has started.
  AcsReplicationProgress replication = 7;
  // Whether the party ACS has been successfully replicated to the target participant,
  // i.e. whether party replication has succeeded and is done.
  // required
  bool has_completed = 8;
  // Error details.
  // optional, set when there is a transient or terminal error.
  AcsReplicationError error_message = 9;
}

/**
 * ACS replication protocol message sent by the target participant to the source participant.
 */
message AcsReplicationTargetParticipantMessage {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";

  // The Initialize instruction must be the first message to the source participant
  // and must never be sent as the second or later message.
  message Initialize {
    option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";
    // The ACS contract ordinal (0-based) to send as part of the first SendAcsUpTo instruction.
    uint64 initial_contract_ordinal_inclusive = 1;
  }

  // SendAcsUpTo instructs the source participant to send ordered ACS contracts up to a specified
  // maximum ordinal.
  // This instruction lets the target participant flow-control the rate of ACS ingestion.
  message SendAcsUpTo {
    option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";
    // ACS contract ordinal (0-based) deterministic on the source participant. This serves as a
    // watermark specifying up to which contract ordinal inclusively the source participant is expected
    // to send ACS contracts.
    // Required
    uint64 max_contract_ordinal_inclusive = 1;
  }

  oneof instruction {
    Initialize initialize = 1;
    SendAcsUpTo send_acs_up_to = 2;
  }
}

/**
 * ACS replication protocol message sent by the source participant to the target participant.
 */
message AcsReplicationSourceParticipantMessage {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";

  // Batch of ACS contracts previously requested by the target participant.
  message AcsBatch {
    option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";

    // The portion of the ACS in the batch expressed as nonempty list
    // Required
    repeated com.digitalasset.canton.admin.participant.v30.ActiveContract contracts = 1;
  }

  // Status message that signals the end of the ACS snapshot affixed with a signed ACS digest.
  message EndOfAcs {
    option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";

    // The binary proto serialization of the AcsDigest serialized and signed by the source participant
    // and parseable by the target participant.
    // required
    bytes acs_digest = 1;
    // The source participant signature of the binary acs_digest.
    // required
    com.digitalasset.canton.crypto.v30.Signature signature = 2;
  }

  oneof data_or_status {
    AcsBatch acs_batch = 1;
    EndOfAcs end_of_acs = 2;
  }
}

// The ACS digest
message AcsDigest {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";

  // Contract LtHash16Blake3 hash of contract ids and reassignment counters.
  // required
  bytes acs_hash = 1;
  // Arguments with which the ACS is fetched from the Ledger API.
  // required
  GetAcsArguments get_acs_args = 2;
  // The source participant that generated the ACS and digest.
  // required
  string source_participant_uid = 3;
  // The human-readable timestamp at which the ACS request has been issued,
  // specifically the is the ledger effective time of the Daml PartyAcsReplication admin agreement.
  // required
  google.protobuf.Timestamp agreed_at = 4;
}

// The arguments that determine the contents of the ACS snapshot and that are included
// in the ACS digest.
message GetAcsArguments {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";

  // The ID of the party whose ACS contracts are sent.
  // required
  string party_id = 1;
  // The ID of the synchronizer with the ACS contracts.
  // required
  string synchronizer_id = 2;
  // The ACS snapshot timestamp at which the sent contracts are active.
  // required
  google.protobuf.Timestamp as_of = 3;
  // The stakeholders whose ACS contracts to exclude from sending, typically because
  // the target participant already has these contracts.
  // optional: can be empty
  repeated string excluded_stakeholders = 4;
}
