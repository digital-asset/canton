syntax = "proto3";

package com.digitalasset.canton.protocol.v31;

import "com/digitalasset/canton/crypto/v30/crypto.proto";
import "com/digitalasset/canton/protocol/v30/topology.proto";
import "scalapb/scalapb.proto";

// Difference with v30:
// - removed reserved fields 4 and 5
// - changed field number of party_signing_keys from 6 to 4
// - uses v31.PartyToParticipant.HostingParticipant for participants, which replaces the onboarding flag
//   with a hosting state
// Mapping that maps a party to a participant
// The PartyToParticipant mapping may also specify a list of signing keys for setting up an external party, in which
// case the keys and the threshold take precedence over any PartyToKeyMapping for the same party.
// Additionally, the list of signing keys may contain the public key of the party's namespace, which allows this
// mapping to authorize itself without the need of a NamespaceDelegation root certificate (called self-signed).
// authorization: the required authorization of the mapping is a union of the authorization for individual changes
//  - threshold change: party namespace
//  - adding a signing key: party namespace + all the new signing key
//  - removing a signing key: party namespace
//  - changing the signing key threshold: party namespace
//  - upgrading a participant permission or adding a new participant: namespaces from party and the participant namespace
//    - exception: adding a participant in the Nominated state requires only the party namespace
//  - downgrading a participant permission or removing a participant: party namespace OR the participant namespace
//  - moving a participant's hosting state forward (Nominated < Freezing < Onboarding < Active, states may be skipped):
//    participant namespace
//  - moving a participant's hosting state backward: party namespace, but validation rejects it whoever signs;
//    a restart is a removal followed by a new nomination
//    - Active -> Onboarding (setting the onboarding flag on a participant that already hosts the party) is such a
//      backward move. In v30 it remains accepted with the party namespace.
//  - the removal of a PTP must be authorized just by the party
// revocation: Revoking a self-signed PTP does not prevent later re-creation of a PTP with the same partyId.
//  To prevent further usage of the key associated with the party's namespace,
//  revoke a NamespaceDelegation root certificate for that namespace.
// UNIQUE(party)
message PartyToParticipant {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";

  message HostingParticipant {
    // The hosting states a participant moves through when it replicates the party,
    // in the order Nominated, Freezing, Onboarding, Active.
    enum HostingState {
      HOSTING_STATE_UNSPECIFIED = 0;

      // the party has nominated the participant to host it; the participant has not yet started to replicate the party
      HOSTING_STATE_NOMINATED = 1;

      // the participant replicates the party's active contract set; the party is frozen while any participant is in this state
      HOSTING_STATE_FREEZING = 2;

      // the participant receives the party's events but does not confirm (equivalent to the v30 onboarding flag)
      HOSTING_STATE_ONBOARDING = 3;

      // the participant hosts the party
      HOSTING_STATE_ACTIVE = 4;
    }

    // the target participant that the party should be mapped to
    string participant_uid = 1;

    // permission of the participant for this particular party (the actual
    // will be min of ParticipantSynchronizerPermission.ParticipantPermission and this setting)
    v30.Enums.ParticipantPermission permission = 2;

    // the hosting state of the participant for this particular party
    HostingState state = 3;
  }

  // the party that is to be represented by the participants
  string party = 1;

  // the signatory threshold required by the participants to be able to act on behalf of the party.
  // a mapping with threshold > 1 is considered a definition of a consortium party
  uint32 threshold = 2;

  // which participants will host the party.
  // if threshold > 1, must be Confirmation or Observation.
  // if all participants have Observation permission, the confirmation treshold is ignored, making the party
  // a purely observing party.
  repeated HostingParticipant participants = 3;

  // Contains protocol signing keys for the party used to authorize externally signed Daml transactions,
  // along with a signing threshold.
  // The max number of keys is the synchronizer's max_signing_keys_per_entity topology limit
  optional com.digitalasset.canton.crypto.v30.SigningKeysWithThreshold party_signing_keys = 4;
}

// Difference with v30:
// - compacted field numbers by removing reserved gaps
// - uses v31.PartyToParticipant
message TopologyMapping {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";

  oneof mapping {
    v30.NamespaceDelegation namespace_delegation = 1;
    v30.DecentralizedNamespaceDefinition decentralized_namespace_definition = 2;

    v30.OwnerToKeyMapping owner_to_key_mapping = 3;

    v30.SynchronizerTrustCertificate synchronizer_trust_certificate = 4;
    v30.ParticipantSynchronizerPermission participant_permission = 5;
    v30.PartyHostingLimits party_hosting_limits = 6;
    v30.VettedPackages vetted_packages = 7;

    PartyToParticipant party_to_participant = 8;

    v30.SynchronizerParametersState synchronizer_parameters_state = 9;
    v30.MediatorSynchronizerState mediator_synchronizer_state = 10;
    v30.SequencerSynchronizerState sequencer_synchronizer_state = 11;
    v30.DynamicSequencingParametersState sequencing_dynamic_parameters_state = 12;

    // Deprecated in favor of PartyToParticipant
    v30.PartyToKeyMapping party_to_key_mapping = 13 [deprecated = true];

    v30.LsuAnnouncement synchronizer_upgrade_announcement = 14;
    v30.LsuSequencerConnectionSuccessor sequencer_connection_successor = 15;
  }
}

// Difference with v30:
// - uses v31.TopologyMapping
message TopologyTransaction {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";

  v30.Enums.TopologyChangeOp operation = 1;

  // Serial identifier of this transaction used to prevent replay attacks.
  // A topology transaction is replacing the existing transaction with serial - 1
  // that has the same unique key.
  uint32 serial = 2;

  // the element of this topology transaction
  TopologyMapping mapping = 3;
}
