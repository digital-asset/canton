syntax = "proto3";

package com.digitalasset.canton.protocol.v31;

import "com/digitalasset/canton/crypto/v30/crypto.proto";
import "google/protobuf/duration.proto";
import "scalapb/scalapb.proto";

// Compared to v30 (Envelope):
//  - Removed the "recipients" fields
//  - Renamed from "Envelope" to "EnvelopeWithoutRecipients"
//  - Removed "option (scalapb.message).companion_extends"
message EnvelopeWithoutRecipients {
  // Contains a v30.EnvelopeContent if signatures are empty and a v30.TypedSignedProtocolMessageContent otherwise
  bytes content = 1;

  // An honest sequencer rejects the request if it contains an envelope with an invalid signature.
  // As only honest sequencers verify signatures, clients should not trust a single sequencer node to verify signatures for them.
  repeated com.digitalasset.canton.crypto.v30.Signature signatures = 2;
}

// size limits on various collections, globally enforced on a synchronizer
message SynchronizerLimits {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.StableProtoVersion";

  TransactionProtocolLimits transaction_protocol_limits = 1;
}

// size limits on collections within the transaction protocol
message TransactionProtocolLimits {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.StableProtoVersion";

  // maximum number of `actAs` entries in a transaction
  uint32 max_act_as = 1;

  // maximum number of envelopes in the batch
  uint32 max_envelopes = 2;

  // maximum number of `Recipients` structures in the batch
  uint32 max_recipients_per_batch = 3;

  // maximum number of recipients trees in a `Recipients` structure
  uint32 max_recipients_trees = 4;

  // maximum number of recipients in a level of a recipients tree
  uint32 max_recipients_per_recipients_tree_level = 5;

  // maximum number of children in a level of a recipients tree
  uint32 max_children_per_recipients_tree_level = 6;

  // maximum number of distinct recipients of a single envelope
  uint32 max_recipients_per_envelope = 7;

  // maximum depth of a recipients tree in a single envelope
  uint32 max_recipients_tree_depth = 8;

  // maximum number of root views in a transaction
  uint32 max_transaction_root_views = 9;

  // maximum number of sub views per root view
  uint32 max_transaction_sub_views = 10;

  // maximum depth of the view tree in a transaction
  uint32 max_transaction_tree_depth = 11;
}

// Differences with v30:
// - add `synchronizer_limits`
message StaticSynchronizerParameters {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.StableProtoVersion";

  com.digitalasset.canton.crypto.v30.RequiredSigningSpecs required_signing_specs = 1;
  com.digitalasset.canton.crypto.v30.RequiredEncryptionSpecs required_encryption_specs = 2;
  repeated com.digitalasset.canton.crypto.v30.SymmetricKeyScheme required_symmetric_key_schemes = 3;
  repeated com.digitalasset.canton.crypto.v30.HashAlgorithm required_hash_algorithms = 4;
  repeated com.digitalasset.canton.crypto.v30.CryptoKeyFormat required_crypto_key_formats = 5;
  repeated com.digitalasset.canton.crypto.v30.SignatureFormat required_signature_formats = 6;
  int32 protocol_version = 7;

  // Serial of the synchronizer. Must be non-negative.
  int32 serial = 8;

  // Flag to enable transparency checks.
  bool enable_transparency_checks = 9;

  google.protobuf.Duration topology_change_delay = 10;

  // Size limits to be enforced on this synchronizer
  com.digitalasset.canton.protocol.v31.SynchronizerLimits synchronizer_limits = 11;
}
