syntax = "proto3";

package com.digitalasset.canton.protocol.v31;

import "com/digitalasset/canton/protocol/v30/synchronizer_parameters.proto";
import "com/digitalasset/canton/protocol/v30/traffic_control_parameters.proto";
import "google/protobuf/duration.proto";
import "scalapb/scalapb.proto";

// size limits on various collections
message SizeLimits {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.StableProtoVersion";

  TransactionProtocolLimits transaction_protocol_limits = 1;
}

// size limits on collections within the transaction protocol
message TransactionProtocolLimits {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.StableProtoVersion";

  // maximum number of `actAs` entries in a transaction
  uint32 max_act_as = 1;
}

// Differences with v30:
// - add `size_limits`
message DynamicSynchronizerParameters {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.StableProtoVersion";

  google.protobuf.Duration confirmation_response_timeout = 1;
  google.protobuf.Duration mediator_reaction_timeout = 2;
  google.protobuf.Duration assignment_exclusivity_timeout = 3;
  reserved 4; // was topology_change_delay = 4;
  google.protobuf.Duration ledger_time_record_time_tolerance = 5;
  google.protobuf.Duration reconciliation_interval = 6;
  google.protobuf.Duration mediator_deduplication_timeout = 7;

  // Note: limits obtained from the topology transactions are active
  // on Netty only after a node restart, since it is not possible
  // to change the configured maxRequestSize on a running instance
  // of Netty. However, the application-layer size checks
  // (in GrpcSequencerService) are immediately active after an update.

  // Thus, in combination, decreased limits are immediately
  // enforced, but increased limits require a node restart to update.
  uint32 max_request_size = 8;

  // topology related validation parameters
  // permissioned synchronizer: if true, only participants which have been explicitly
  // put on the allow list can onboard to the synchronizer
  v30.OnboardingRestriction onboarding_restriction = 9;

  reserved 11; // was required_packages = 11;

  reserved 12; // was only_required_packages_permitted = 12;

  v30.ParticipantSynchronizerLimits participant_synchronizer_limits = 13;

  reserved 14; // was default_max_hosting_participants_per_party = 14;
  google.protobuf.Duration sequencer_aggregate_submission_timeout = 15;
  v30.TrafficControlParameters traffic_control = 16;
  v30.AcsCommitmentsCatchUpConfig acs_commitments_catchup = 17;
  google.protobuf.Duration preparation_time_record_time_tolerance = 18;

  SizeLimits size_limits = 19;
}
