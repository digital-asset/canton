syntax = "proto3";

package com.digitalasset.canton.protocol.v31;

import "com/digitalasset/canton/crypto/v30/crypto.proto";
import "com/digitalasset/canton/protocol/v30/common.proto";
import "com/digitalasset/canton/protocol/v30/merkle.proto";
import "com/digitalasset/canton/protocol/v30/participant_transaction.proto";
import "com/digitalasset/canton/protocol/v31/common_stable.proto";
import "scalapb/scalapb.proto";

// Messages sent by a participant as part of the transaction protocol

// Compared to v30: No LookupByKeyActionDescription
message ActionDescription {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.StableProtoVersion";
  oneof description {
    v30.ActionDescription.CreateActionDescription create = 1;
    v30.ActionDescription.ExerciseActionDescription exercise = 2;
    v30.ActionDescription.FetchActionDescription fetch = 3;
  }
}

// Compared to v30:
// - resolved_keys now has new structure
// - action_description uses updated structure
message ViewParticipantData {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.StableProtoVersion";

  message KeyResolutionWithMaintainers {
    v31.GlobalKey key = 1;
    repeated string maintainers = 2;
    repeated string contract_ids = 3;
  }

  com.digitalasset.canton.crypto.v30.Salt salt = 1;
  repeated v30.InputContract core_inputs = 2;
  repeated v30.CreatedContract created_core = 3;
  repeated string created_in_subview_archived_in_core = 4; // ids of contracts created in a subview and archived in the core
  repeated KeyResolutionWithMaintainers resolved_keys = 5;
  ActionDescription action_description = 6;
  v30.ViewParticipantData.RollbackContext rollback_context = 7; // optional; defaults to the empty RollbackContext if omitted.
}

// Compared to v30:
// - We no longer use v30.ViewHashAndKey (which contained view_hash + key fields).
// - Instead, we introduce CiphertextIdAndKey, which pairs a ciphertext ID (hash), the relative position of the view
//   inside the encrypted view array, and the corresponding session key.
// - The view_hash is replaced by ciphertext_id + index.
message LightTransactionViewTree {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.AlphaProtoVersion";

  v30.GenTransactionTree tree = 1;
  repeated CiphertextIdAndKey subview_keys_by_ciphertext_id = 2;
}

// A ciphertext ID (hash) + index that uniquely identifies a view, together with the
// session key randomness used to encrypt the view.
message CiphertextIdAndKey {
  // Hash of the ciphertext that contains the view.
  bytes ciphertext_id = 1;
  // Position of the view within the encrypted views array (0-based index).
  // Together with ciphertext_hash, this forms the ciphertext ID and uniquely identifies a view.
  int32 index = 2;
  // The randomness used to derive the encryption key for the view
  bytes view_encryption_key_randomness = 3;
}

// Compared to v30: Added this class
message EncryptedMultipleViewsMessage {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.StableProtoVersion";

  // A wrapper for a collection of view trees (serialized, uncompressed)
  message UncompressedViewTrees {
    repeated bytes view_trees = 1;
  }

  // Bytes containing the result of compressing the UncompressedViewTrees instance
  bytes compressed_view_trees = 1;

  repeated bytes view_hashes = 2;

  // The symmetric encryption scheme used to encrypt the view tree and the session key
  com.digitalasset.canton.crypto.v30.SymmetricKeyScheme encryption_scheme = 3;

  com.digitalasset.canton.crypto.v30.Signature submitting_participant_signature = 4; // optional

  repeated com.digitalasset.canton.crypto.v30.AsymmetricEncrypted session_key_lookup = 5;
  string physical_synchronizer_id = 6;
  v30.ViewType view_type = 7;
}

// Compared to v30: rolled_back removed
message CreatedContract {
  bytes contract = 1; // Encoded ContractInstance
  bool consumed_in_core = 2;
  reserved 3; // was rolled_back
}
