syntax = "proto3";

// Testing and benchmarking tooling only: no backward or forward compatibility guarantees, not for production use.
package com.digitalasset.daml.lf.testing.snapshot;

import "com/digitalasset/daml/lf/transaction.proto";
import "com/digitalasset/daml/lf/value.proto";

option java_package = "com.digitalasset.daml.lf.testing.snapshot";

message Transaction {
  string version = 1;
  repeated string roots = 2;
  repeated Node nodes = 3;
}

message Node {
  string version = 1;
  string node_id = 2;
  oneof node_type {
    com.digitalasset.daml.lf.transaction.FatContractInstance create = 3;
    Fetch fetch = 4;
    Exercise exercise = 5;
    Rollback rollback = 6;
    QueryByKey query_by_key = 7;
  }

  message Fetch {
    bytes contract_id = 1;
    string package_name = 2;
    com.digitalasset.daml.lf.value.Identifier template_id = 3; // required
    com.digitalasset.daml.lf.value.Identifier interface_id = 7; // optional
    repeated string non_maintainer_signatories = 4;
    repeated string non_signatory_stakeholders = 5;
    repeated string actors = 6;
    com.digitalasset.daml.lf.transaction.KeyWithMaintainers key_with_maintainers = 8;
    bool by_key = 9;
  }

  message Exercise {
    Fetch fetch = 1; // required
    com.digitalasset.daml.lf.value.Identifier interface_id = 2; // optional
    string choice = 3;
    bytes arg = 4;
    bool consuming = 5;
    repeated string children = 6; // node ids
    bytes result = 7;
    repeated string observers = 8;
    // No listed authorizers indicates default authorizers (signatories + actors)
    repeated string authorizers = 1001; // *since version dev*
    // Results of external calls made during this exercise
    repeated com.digitalasset.daml.lf.transaction.ExternalCallResult external_call_results = 9; // *since serialization version 3*
  }

  message Rollback {
    repeated string children = 1; // node ids
  }

  message QueryByKey {
    string package_name = 1;
    com.digitalasset.daml.lf.value.Identifier template_id = 2;
    com.digitalasset.daml.lf.transaction.KeyWithMaintainers key_with_maintainers = 3;
    repeated bytes contract_id = 4;
    bool exaustive = 5;
  }
}

message MetricPlugin {
  string name = 1;
  int64 total = 2;
}

message TransactionEntry {
  bytes rawTransaction = 1;
  string participantId = 2;
  repeated string submitters = 3;
  int64 ledgerTime = 4;
  int64 preparationTime = 5;
  bytes submissionSeed = 6;
  repeated MetricPlugin metricPlugins = 7;
  // the seed contract IDs are derived from; empty in older recordings
  bytes transactionSeed = 8;
  ContractIdVersion contractIdVersion = 9;
  map<string, string> packageResolution = 10;
  // contracts read from the ledger, encoded with ContractInstanceCoder
  repeated bytes inputContracts = 11;
  // non-empty ledger answers to key lookups
  repeated KeyLookup keyLookups = 12;
  repeated string usedPackages = 13;
  // the config the engine interpreted the transaction with; absent in older recordings
  InterpretationConfig interpretationConfig = 14;
}

message InterpretationConfig {
  repeated string allowedLanguageVersions = 1;
}

message KeyLookup {
  // contracts with the same key, in the order the ledger returned them
  repeated bytes contractIds = 1;
}

enum ContractIdVersion {
  CONTRACT_ID_VERSION_UNSPECIFIED = 0;
  CONTRACT_ID_VERSION_V1 = 1;
  CONTRACT_ID_VERSION_V2 = 2;
}

message SubmissionEntry {
  oneof entry {
    TransactionEntry transaction = 1;
    // a serialized Archive; must precede the transactions using it
    bytes archives = 2;
  }
}
