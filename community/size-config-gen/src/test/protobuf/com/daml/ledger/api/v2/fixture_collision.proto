syntax = "proto3";

package com.daml.ledger.api.v2;

// FixtureA.BC and FixtureAB.C both map to FixtureABCSizeConfig.
message FixtureA {
  message BC {
    bytes x = 1;
  }
}

message FixtureAB {
  message C {
    bytes y = 1;
  }
}
