include required("composability.conf")

// composability1.canton reassigns contracts manually. Disable automatic assignment, otherwise it
// can race with the manual assignment and lock the contract.
canton.participants {
  participant1.parameters.reassignments-config.enable-automatic-assignment = false
  participant2.parameters.reassignments-config.enable-automatic-assignment = false
  participant3.parameters.reassignments-config.enable-automatic-assignment = false
  participant4.parameters.reassignments-config.enable-automatic-assignment = false
  participant5.parameters.reassignments-config.enable-automatic-assignment = false
}
