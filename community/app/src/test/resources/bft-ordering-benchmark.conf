# BFT ordering benchmark configuration example.
# Refer to `BftOrderingBenchmarkConfig` for details.

# number-of-nodes = 4

# run-duration = 15 minutes

# per-node-write-period = 4 milliseconds

# reporting-interval = 1 minute

# metrics-config {
#   # See `MetricsConfig` for details.
# }

# segment-length = 16

# consensus-empty-block-creation-timeout = 1 seconds

# pbft-view-change-timeout = 5 seconds

# blacklist-leader-selection-policy-config {
#   how-long-to-blacklist { type = no-blacklisting }
#   how-many-can-we-blacklist { type = no-blacklisting }
# }

# max-requests-in-batch = 64

# min-requests-in-batch = 5

# max-batch-creation-interval = 250 milliseconds

# max-batches-per-block-proposal = 32

# availability-min-proposal-creation-delay = 100 milliseconds

# batch-cache-size-mb = 64

# dedicated-execution-context-divisor = 4

# pruning-retention-period-seconds = 1800

# pruning-min-blocks-to-keep-history = 500

# use-in-memory-storage-for-bft-orderer = true

# number-of-db-connections-per-node = 20

# delayed-init-queue-max-size = 512

# epoch-state-transfer-retry-timeout = 2 seconds

# output-fetch-timeout = 5 seconds

# output-fetch-minimum-delay = 2 seconds

# output-fetch-timeout-cap = 10 seconds

# output-fetch-how-many-recipients = 3

# output-enqueue-max-retries = 5

# output-enqueue-max-retry-delay = 3 seconds

# send-blacklist-ttl = 5 minutes

# network-send-attempts = 5

# network-send-retry-minimum-delay = 1000 milliseconds

# network-send-retry-jitter-cap = 15000 milliseconds

# p-2p-server-max-inbound-message-size = 500000

# p-2p-server-flow-control-window = 10485760

# p-2p-server-initial-flow-control-window = 10485760

# p-2p-server-max-concurrent-calls-per-connection = 50000

# p-2p-server-limits {
#   See `ActiveRequestLimitsConfig` for details.
# }

# p-2p-server-keep-alive-config {
#   See `BasicKeepAliveServerConfig` for details.
# }

# p-2p-client-channel-params {
#   See `ClientChannelParams` for details.
# }

# tracing-enabled = false

# tracing-reporting-port = 4317

# tracing-sampler-ratio = 0.25

# transaction-sizes-and-weights {
#   payloads = [
#     { size-bytes = 3000, weight = 9 },
#     { size-bytes = 30000, weight = 1 }
#   ]
# }

# sequencer-to-sequencer-latency-millis = 10

# sequencer-db-latency-millis = 5

# db-replication-enabled = false

# test-catchup-config {
#   nodes-to-stop = [1]
#   duration-nodes-are-down = 1 minute
#   duration-node-need-to-startup = 1 minute
# }

# pekko-queue-source-buffer-size = 1000

# pause-orderer-threshold-buffer-size = 500

# resume-orderer-threshold-buffer-size = 250

