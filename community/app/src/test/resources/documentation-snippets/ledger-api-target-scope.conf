canton {
  // Scope-only JWTs are deprecated and disabled by default; a target-scope without a target-audience
  // only works while this flag is set.
  features.deprecated.enable-scope-only-jwt = true
  participants {
    participant {
      ledger-api {
        auth-services = [{
          type = jwt-jwks
          url = "https://some.url/jwks.json"
          target-scope = "custom/Scope-5:with_special_characters"
        }]
      }
    }
  }
}
