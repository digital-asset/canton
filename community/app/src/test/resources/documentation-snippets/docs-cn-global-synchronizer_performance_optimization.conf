# CF_DOCS_SNIPPET_GS_PERFORMANCE_STORAGE_CONNECTION_POOL_START
canton.participants.participant.storage {
  type = "memory"

  config {
    # Maximum number of connections in the pool
    maxConnections = 30

    # Connection timeout in milliseconds
    connectionTimeout = 30000
  }
}
# CF_DOCS_SNIPPET_GS_PERFORMANCE_STORAGE_CONNECTION_POOL_END

# CF_DOCS_SNIPPET_GS_PERFORMANCE_PRUNING_BATCH_START
canton.participants.participant.parameters.batching {
  # Prune data older than this duration
  max-pruning-batch-size = 1000
}
# CF_DOCS_SNIPPET_GS_PERFORMANCE_PRUNING_BATCH_END
