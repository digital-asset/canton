# CF_DOCS_SNIPPET_APPDEV_CONFIG_ENV_SUBSTITUTION_START
dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
properties = {
    serverName = "localhost"
    serverName = ${?POSTGRES_HOST}  # overrides only if POSTGRES_HOST is set
    user = ${?POSTGRES_USER}          # required, fails if unset
    password = ${?POSTGRES_PASSWORD}  # required, fails if unset
}
# CF_DOCS_SNIPPET_APPDEV_CONFIG_ENV_SUBSTITUTION_END

# CF_DOCS_SNIPPET_APPDEV_CONFIG_PARTICIPANT_INIT_START
participant1 {
  init {
    ledger-api.max-deduplication-duration = 1 minute
    identity.node-identifier.type = random
  }
}
# CF_DOCS_SNIPPET_APPDEV_CONFIG_PARTICIPANT_INIT_END

# CF_DOCS_SNIPPET_APPDEV_CONFIG_ALPHA_VERSION_SUPPORT_START
canton.parameters {
  non-standard-config = yes
  alpha-version-support = yes
}

canton.participants.participant1.parameters = {
  alpha-version-support = yes
}
# CF_DOCS_SNIPPET_APPDEV_CONFIG_ALPHA_VERSION_SUPPORT_END
