number-of-nodes = 1

run-duration = 15 minutes

per-node-write-period = 250 microseconds

min-requests-in-batch = 16
max-batch-creation-interval = 150 milliseconds
max-batches-per-block-proposal = 31
availability-min-proposal-creation-delay = 250 milliseconds

pruning-retention-period-seconds = 1800
pruning-min-blocks-to-keep-history = 500

number-of-db-connections-per-node = 12

transaction-sizes-and-weights {
  payloads = [
    { size-bytes = 3000, weight = 1 }
  ]
}

db-replication-enabled = true
