syntax = "proto3";

package com.digitalasset.canton.synchronizer.sequencing.sequencer.bftordering.v31;

import "com/digitalasset/canton/synchronizer/sequencing/sequencer/bftordering/v30/bft_ordering_service.proto";
import "scalapb/scalapb.proto";

// State transfer
message StateTransferMessage {
  option (scalapb.message).companion_extends = "com.digitalasset.canton.version.StableProtoVersion";
  oneof message {
    com.digitalasset.canton.synchronizer.sequencing.sequencer.bftordering.v30.BlockTransferRequest block_request = 1;
    com.digitalasset.canton.synchronizer.sequencing.sequencer.bftordering.v30.RetransmissionResponse block_response = 2;
  }
}
