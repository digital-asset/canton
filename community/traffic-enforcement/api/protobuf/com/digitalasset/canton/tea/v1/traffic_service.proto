syntax = "proto3";

package com.digitalasset.canton.tea.v1;

import "google/protobuf/timestamp.proto";

// Service used for book-keeping and managing of traffic accounts for Ledger API users.
service TrafficService {
  // Get account state for a given account ID.
  // Permissioned to users with CanDebitTrafficFrom for the account ID, CanDebitTrafficFromAnyAccount,
  // ActAsAnyParty, ExecuteAsAnyParty, or ActAs or ExecuteAs rights for the party with the same ID.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);

  // Update account state for a given account ID.
  // Permissioned only to Ledger API admin users.
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);

  // Prune events from the event log, submission correlations, and uncharged completions that are older than a given timestamp.
  // Submission correlations record the account each submission is charged to.
  // Uncharged completions record completions with a positive cost that weren't charged to any account.
  // Permissioned only to Ledger API admin users.
  // The timestamp must be at least the participant's max deduplication duration in the past
  // (7 days by default), otherwise the request is rejected with TRAFFIC_UNSAFE_TO_PRUNE.
  // WARNING: Affects de-duplication. If an event is pruned, de-duplication UpdateAccount requests on it will NOT be possible.
  // WARNING: If a submission's correlation is pruned before its completion arrives, the submission is NOT debited.
  rpc Prune(PruneRequest) returns (PruneResponse);

  // List accounts and their details.
  // Accounts that were never credited or debited are not listed.
  //
  // Permissioned to users holding CanActAsAnyParty, CanExecuteAsAnyParty or CanDebitTrafficFromAnyAccount rights.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);

  // Deprecated since Canton 3.7, disabled by default since Canton 3.8 and removed in Canton 3.9.
  // Use Prune instead.
  // Served by Prune, and returns only the number of pruned events.
  // Permissioned only to Ledger API admin users.
  rpc PruneEvents(PruneEventsRequest) returns (PruneEventsResponse) {
    option deprecated = true;
  }
}

message GetAccountRequest {
  // One or more non-empty segments separated by `/`, at most 255 characters in total, using
  // ASCII letters, digits, space, and @^$.!`-#+'~_|:(). Every party ID is a valid account ID.
  //
  // Required
  string account_id = 1;
}

message GetAccountResponse {
  // Required
  string account_id = 1;

  // Required
  int64 balance = 2;
}

message UpdateAccountRequest {
  // The account ID whose account to update.
  // Uses the same format as `GetAccountRequest.account_id`.
  //
  // Required
  string account_id = 1;

  // Balance DELTA to apply to the current balance.
  // Negative values will decrease the balance, positive values will increase the balance.
  // If unset, the balance will not be updated
  //
  // Note that setting a negative value may result in a negative balance if the delta is larger than the current balance.
  // Optional
  optional int64 balance_delta = 2;

  // Identifier of this logical update, used to de-duplicate.
  // The caller MUST use a distinct id for every distinct update, and MUST reuse the same id when
  // retrying an update that failed after a retryable error. An already processed id is ignored,
  // while a fresh id applies the delta again.
  //
  // Required
  string deduplication_id = 3;
}

message UpdateAccountResponse {
  // The account state after the update
  //
  // Required
  GetAccountResponse response = 1;
}

message PruneRequest {
  // The timestamp before which events, submission correlations, and uncharged completions should be pruned.
  // Events, submission correlations, and uncharged completions with a timestamp less than or equal to this value will be pruned.
  //
  // Required
  google.protobuf.Timestamp before_or_at = 1;
}

message PruneResponse {
  // The number of events that were pruned.
  //
  // Required
  int32 pruned_event_count = 1;

  // The number of submission correlations that were pruned.
  //
  // Required
  int32 pruned_correlation_count = 2;

  // The number of uncharged completions that were pruned.
  //
  // Required
  int32 pruned_uncharged_completion_count = 3;
}

message ListAccountsRequest {
  // The maximum account details to return on a page response.
  // If unset, defaults to 100.
  // Values above 1000 or below 1 are rejected with INVALID_ARGUMENT.
  //
  // Optional
  optional int32 page_size = 1;

  // Next page token.
  // Leave unset or empty to fetch the first page or set to the `next_page_token`
  // of the previous response to fetch the next page.
  //
  // Optional
  optional string page_token = 2;

  // Prefix filter for the returned account IDs.
  // Empty acts as a wildcard filter.
  //
  // Optional
  optional string account_id_prefix = 3;
}

message ListAccountsResponse {
  // List of accounts and their details, ordered lexicographically by account ID,
  // up to the requested page size.
  //
  // Optional: may be empty
  repeated GetAccountResponse accounts = 1;

  // Token to fetch the next page.
  // Not set, if there are no further results.
  //
  // Optional
  optional string next_page_token = 2;
}

// Structures the payload of a page token for listing accounts.
// The page token is opaque and should not be directly constructed by client applications.
message ListAccountsPageTokenPayload {
  // Next page starts with accounts whose account_id is larger than account_id_lower_bound_excl.
  //
  // Required
  string account_id_lower_bound_excl = 1;
}

message PruneEventsRequest {
  // The timestamp before which events should be pruned.
  // Events with a timestamp less than or equal to this value will be pruned.
  //
  // Required
  google.protobuf.Timestamp before_or_at = 1;
}

message PruneEventsResponse {
  // The number of events that were pruned.
  //
  // Required
  int32 pruned_event_count = 1;
}
