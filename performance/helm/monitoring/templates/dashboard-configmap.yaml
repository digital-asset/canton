---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ $.Release.Name }}-grafana-dashboards-provider"
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ $.Release.Name }}-grafana-dashboards-json"
  namespace: monitoring
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ regexReplaceAll "[^-._a-zA-Z0-9]+" (base $path) "-" }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}  
