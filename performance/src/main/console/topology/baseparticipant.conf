_baseparticipant = {
  parameters {
    alpha-version-support = yes
    beta-version-support = yes
    do-not-await-on-checking-incoming-commitments = yes
    ledger-api-server.indexer.postgres-data-source.client-connection-check-interval = 0ms
    caching {
      contract-store = {
        maximum-size = 10000
        expire-after-access = 120s
      }
    }
    batching {
      contract-journal-aggregator = {
        type = batching
        maximum-in-flight = 2
        maximum-batch-size = 500
      }
      contract-store-aggregator = {
        type = batching
        maximum-in-flight = 3
        maximum-batch-size = 500
      }
    }
  }
  topology {
    dispatch-queue-backpressure-limit = 10000
    broadcast-batch-size = 1000
  }
  storage = ${_shared.storage}
  storage.parameters.connection-allocation {
    num-reads = 6
    num-writes = 6
    num-ledger-api = 6
  }
  ledger-api {
    tls = ${?_shared.ledger-api-tls}
    postgres-data-source.synchronous-commit = off
    // postgres-data-source.client-connection-check-interval = 0ms
    index-service {
      max-contract-state-cache-size = 10000      // default 1e4
      max-contract-key-state-cache-size = 10000  // default 1e4
      max-transactions-in-memory-fan-out-buffer-size=250
    }
    command-service {
      max-commands-in-flight = 10000
    }
  }
  http-ledger-api.enabled = false
  init.ledger-api.max-deduplication-duration = 30m
}
