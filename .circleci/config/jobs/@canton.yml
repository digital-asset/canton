package_community:
  executor: canton-large-docker
  parameters:
    is_nightly_workflow:
      type: boolean
    is_manual:
      type: boolean
  steps:
    - checkout:
        method: blobless
    - obtain_release_suffix:
        is_nightly_workflow: << parameters.is_nightly_workflow >>
        is_manual: << parameters.is_manual >>
    - package:
        cmd: "performance-driver/package performance/package community-app/bundle"
        location: "community/app/target/release"
    - run:
        name: "Package performance runner"
        command: |
          performance/pack-performance.sh -s
    - run:
        name: "Remember version info"
        command: |
          .ci/nix-exec scripts/ci/generate_info_properties.sh
    - persist_to_workspace:
        root: .
        paths:
          - canton-performance.tar.gz
          - info.properties
    - cleanup_build_job

package_jsonapi:
  executor: canton-medium-docker
  parameters:
    is_nightly_workflow:
      type: boolean
    is_manual:
      type: boolean
  steps:
    - checkout:
        method: blobless
    - obtain_release_suffix:
        is_nightly_workflow: << parameters.is_nightly_workflow >>
        is_manual: << parameters.is_manual >>
    - package:
        cmd: "packageJsonApiDocsArtifacts"
        location: "./target"
        artifact_suffix: ".tar.gz"
    - cleanup_build_job

assembly_ledger_api_test_tool:
  executor: canton-medium-docker
  parameters:
    is_nightly_workflow:
      type: boolean
    is_manual:
      type: boolean
  steps:
    - checkout:
        method: blobless
    - obtain_release_suffix:
        is_nightly_workflow: << parameters.is_nightly_workflow >>
        is_manual: << parameters.is_manual >>
    # Generate ledger-api-test-tool jars.
    - package:
        cmd: "ledger-test-tool/assembly"
        location: "community/ledger-test-tool/target/scala-2.13"
        artifact_suffix: ".jar"
    - cleanup_build_job

package_kms_driver:
  executor: canton-medium-docker
  parameters:
    is_nightly_workflow:
      type: boolean
    is_manual:
      type: boolean
  steps:
    - checkout:
        method: blobless
    - obtain_release_suffix:
        is_nightly_workflow: << parameters.is_nightly_workflow >>
        is_manual: << parameters.is_manual >>
    - package:
        cmd: "aws-kms-driver/assembly aws-kms-driver/packageSrc aws-kms-driver/packageDoc aws-kms-driver/makePom"
        location: "community/aws-kms-driver/target/scala-2.13"
        artifact_suffix: ".{jar,pom}"
    - package:
        cmd: "mock-kms-driver/package mock-kms-driver/packageSrc mock-kms-driver/packageDoc mock-kms-driver/makePom"
        location: "community/mock-kms-driver/target/scala-2.13"
        artifact_suffix: ".{jar,pom}"
    - cleanup_build_job
