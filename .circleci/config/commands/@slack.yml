slack_red_main_with_volunteer:
  parameters:
    webhook_url:
      type: string
      default: $SLACK_WEBHOOK_TEAM_CANTON_INTERNAL
    fixed_volunteer:
      type: string
      default: ""
      description: "If set, skip random selection and always ping this Slack user ID."

  steps:
    - run:
        name: Choose volunteer
        when: always
        command: |
          FIXED="<< parameters.fixed_volunteer >>"
          # The usual suspects to ping when no live rota person can be selected. Mirrors the
          # fallback_pool in scripts/ci/roster_people.json (Thibault Bene, Soren Bleikertz,
          # Rafael Guglielmetti), inlined here because the no-checkout path below has no repo
          # to read that file from.
          USUAL_SUSPECTS="U0AHRL04HPV,U276HDDB6,U020XUXADCP"
          # Reason line appended to the alert. The rota wording is the default, 2.x
          # maintenance lines override it below.
          PING_REASON="You are on rota, so please take a look."
          # Choosing a volunteer must never fail this step. It runs with
          # `when: always` on an already-red build, and some jobs invoke it from a
          # working directory that has no repo checkout (no .ci/nix-exec, no
          # scripts/), so guard on the files actually being present and treat every
          # selection path as best-effort, degrading to the usual suspects below.
          if [ -n "$FIXED" ]; then
            SELECTED_VOLUNTEER="$FIXED"
          elif printf '%s' "$CIRCLE_BRANCH" | grep -q '^release-line-2\.'; then
            # The 2.x lines are in maintenance and have no rota column, so ping the
            # usual suspects who own them directly instead of a rota volunteer.
            SELECTED_VOLUNTEER="$USUAL_SUSPECTS"
            PING_REASON="This is a 2.x maintenance line, so pinging the usual suspects."
          elif [ -x .ci/nix-exec ] && command -v nix-shell >/dev/null 2>&1; then
            # Nix executors: run through the nix wrapper so select_rota.py gets its deps.
            SELECTED_VOLUNTEER=$(.ci/nix-exec python3 scripts/ci/select_rota.py --job "$CIRCLE_JOB" || true)
          elif [ -f scripts/ci/select_rota.py ]; then
            # Machine executors (e.g. test_ping_arm) have no nix, so run python3 directly.
            # select_rota.py needs cryptography to sign the Google auth JWT, so install it
            # best-effort and still ping the live rota person. If the install fails the
            # script degrades to its deterministic roster fallback rather than breaking.
            # The plain install covers older pip, and the retry adds --break-system-packages
            # (pip 23+) for images that mark the system Python externally managed (PEP 668).
            python3 -m pip install -q --user cryptography \
              || python3 -m pip install -q --user --break-system-packages cryptography \
              || echo "warning: cryptography install failed, select_rota will use its roster fallback" >&2
            SELECTED_VOLUNTEER=$(python3 scripts/ci/select_rota.py --job "$CIRCLE_JOB" || true)
          else
            echo "warning: no repo checkout in $(pwd), falling back to the usual suspects" >&2
            SELECTED_VOLUNTEER=""
          fi

          # Never ping nobody on a red build: if nothing was selected (no checkout, or
          # select_rota errored above), fall back to the usual suspects.
          if [ -z "$SELECTED_VOLUNTEER" ]; then
            SELECTED_VOLUNTEER="$USUAL_SUSPECTS"
          fi

          echo "$SELECTED_VOLUNTEER"
          echo "export SELECTED_VOLUNTEER=\"${SELECTED_VOLUNTEER}\"" >> $BASH_ENV
          echo "export PING_REASON=\"${PING_REASON}\"" >> $BASH_ENV
    - slack/status:
        mentions: "${SELECTED_VOLUNTEER}"
        fail_only: true
        only_for_branches: main,release-line-2.0,release-line-2.1,release-line-2.2,release-line-2.3,release-line-2.3.10,release-line-2.4,release-line-2.5,release-line-2.6,release-line-2.7,release-line-2.8,release-line-2.9,release-line-2.10,release-line-3.4,release-line-3.5,release-line-3.6,release-line-3.7,release-line-3.8,release-line-3.9,release-line-3.10
        failure_message: '*[CircleCI]* A \`$CIRCLE_JOB\` job has failed on branch \`$CIRCLE_BRANCH\`. $PING_REASON'
        webhook: << parameters.webhook_url >>

# This command will send a notification to team-sdk-updates
# about docs or daml update in canton
send_slack_notification_for_sdk_updates:
  description: Send a message to slack
  parameters:
    message:
      type: string
      default: ""
    from_version:
      type: string
      default: ""
    to_version:
      type: string
      default: ""
    pr_url:
      type: string
      default: ""
  steps:
    - run:
        name: send message to slack
        command: |
          message="<< parameters.message >>"
          from="<< parameters.from_version >>"
          to="<< parameters.to_version >>"
          pr_url="<< parameters.pr_url >>"

          . scripts/ci/common.sh
          tell_slack "$message" "$SLACK_WEBHOOK_TEAM_SDK_UPDATES" "$pr_url" "$from" "$to"
