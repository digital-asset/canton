name: Test Ping ARM
on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label
        required: false
        type: string
        default: ubuntu-24.04-arm

permissions:
  contents: read

jobs:
  test_ping_arm:
    name: Test Ping ARM
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions/test/set_automatic_protocol_version

      - name: Download packaged community release artifacts
        uses: actions/download-artifact@v7
        with:
          name: package-community-release.zip
          path: ${{ runner.temp }}/package-community-artifacts

      - name: Extract community release
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/package-community-artifacts"
          extract_dir="${GITHUB_WORKSPACE}/workspace"
          mkdir -p "$extract_dir"

          shopt -s nullglob
          archives=()
          for archive in "$artifact_dir"/canton-open-source-*.zip; do
            if [[ "$archive" != *-api.zip ]]; then
              archives+=("$archive")
            fi
          done
          if [ ${#archives[@]} -ne 1 ]; then
            echo "Expected one community release ZIP (excluding API ZIPs) in $artifact_dir, found ${#archives[@]}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          unzip -oq "$archive" -d "$extract_dir"
          # The ZIP's top-level directory matches its filename without .zip.
          release_name="$(basename "$archive" .zip)"
          echo "CANTON_RELEASE_DIR=${extract_dir}/${release_name}" >> "$GITHUB_ENV"

      - name: Allow automatic protocol version selection
        uses: ./.github/actions/test/set_automatic_protocol_version

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run ping on ARM release
        shell: bash
        run: |
          set -euo pipefail
          canton_bin="${CANTON_RELEASE_DIR}/bin/canton"
          if [ ! -x "$canton_bin" ]; then
            echo "Could not find executable canton in the extracted community release: $canton_bin" >&2
            exit 1
          fi

          topology_conf="${CANTON_RELEASE_DIR}/examples/01-simple-topology/simple-topology.conf"
          ping_script="${CANTON_RELEASE_DIR}/examples/01-simple-topology/simple-ping.canton"

          "$canton_bin" run -v -c "$topology_conf" "$ping_script"

      - name: Upload log artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-ping-arm-log
          path: log
          if-no-files-found: warn
