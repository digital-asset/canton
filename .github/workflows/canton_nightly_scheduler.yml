name: Canton Nightly Scheduler
on:
  # TODO(#34877): Re-enable this scheduler after the CircleCI migration is
  # complete. The intended end state is a weekday 22:00 UTC dispatch of
  # canton_nightly.yml for main and the lines in
  # release/supported-release-lines.txt.
  # schedule:
  #   - cron: '0 22 * * 1-5'
  workflow_dispatch: {}

# TODO(#34877): Re-enable this scheduler after the CircleCI migration is
# complete.
#permissions:
#  actions: write
#  contents: read

jobs:
  dispatch_nightly:
    name: Dispatch nightly workflow
    if: ${{ startsWith(github.ref, 'refs/heads/gha-migration/') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Nightly scheduler is disabled during migration"
      # TODO(#34877): Re-enable these steps after migration to dispatch
      # canton_nightly.yml for main and the supported release lines.
      # - uses: actions/checkout@v5
      #   with:
      #     sparse-checkout: release
      # - name: Dispatch canton_nightly for main and supported release lines
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #     REPOSITORY: ${{ github.repository }}
      #   run: python3 release/dispatch_nightly.py --repo "$REPOSITORY"

  # A failed or cancelled scheduled run pings the CI rota in #team-canton-internal, so a nightly
  # that never got dispatched is not silent. Inert until TODO(#34877) re-enables the schedule.
  notify:
    name: Notify on Failure
    needs: [dispatch_nightly]
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    uses: ./.github/workflows/_notify.yml
    secrets: inherit
    with:
      needs_json: ${{ toJSON(needs) }}
