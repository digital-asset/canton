name: Toxiproxy Test Fast
on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label
        required: true
        type: string
    secrets:
      DATADOG_API_KEY:
        required: true
      GCLOUD_SERVICE_KEY:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
      AWS_REGION:
        required: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  toxiproxy_test_fast:
    name: Toxiproxy Test Fast (shard ${{ matrix.shard }})
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    timeout-minutes: 180
    env:
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: "10"
      EXECUTOR_JVM_HEAP_SIZE: 14000M
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with: {fetch-depth: 0}

      - name: Start Postgres container
        id: start_postgres
        uses: ./.github/actions/utils/postgres/start_postgres_container_standard
        with:
          shard-index: ${{ matrix.shard }}

      - name: Start Toxiproxy container
        id: start_toxiproxy
        uses: ./.github/actions/utils/toxiproxy/start_toxiproxy_container
        with:
          shard-index: ${{ matrix.shard }}
          network-mode: host

      - name: Prepare test inputs and timings
        uses: ./.github/actions/test/prepare_test_inputs_with_timings
        with:
          timings-artifact-name: ${{ github.job }}-timings-latest
          timings-path: ${{ github.job }}/.timings
          github-token: ${{ github.token }}

      - name: Run Toxiproxy Fast Tests
        id: run_toxiproxy_tests
        uses: ./.github/actions/test/run_tests
        with:
          command: >-
            dumpClassPath "$RUN_SPLITTED_TESTS_CMD -- -l UnstableTest -l com.digitalasset.canton.annotations.UnstableTest"
          reset_classes_if_requested: 'false'
          execution_context_size: "8"
          fail_on_error_in_output: 'false'
          num_test_buckets: '6'
          shard_index: ${{ matrix.shard }}
          num_parallel_tasks: '1'
          timings_file: ${{ github.job }}/.timings/timings.json
          include_patterns: |
            ^com\.digitalasset\.canton\.integration\.tests\.toxiproxy\.fast

      - name: Stop Postgres container
        if: always()
        uses: ./.github/actions/utils/postgres/stop_postgres_container
        with:
          container-name: ${{ steps.start_postgres.outputs.container-name }}

      - name: Stop Toxiproxy container
        if: always()
        uses: ./.github/actions/utils/toxiproxy/stop_toxiproxy_container
        with:
          container-name: ${{ steps.start_toxiproxy.outputs.container-name }}

  aggregate_shard_outputs:
    name: Aggregate Shard Outputs
    needs: toxiproxy_test_fast
    if: always()
    uses: ./.github/workflows/_aggregate_test_shard_outputs.yml
    with:
      caller_job: toxiproxy_test_fast
      runner: ${{ inputs.runner }}
      protocol_version: ""
