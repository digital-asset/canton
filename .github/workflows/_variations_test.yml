name: Variations Test
on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
      GCLOUD_SERVICE_KEY:
        required: true
      DATADOG_API_KEY:
        required: true
    inputs:
      only_for_selected_users:
        default: false
        type: boolean
      override_java_version_for_tests:
        default: ""
        type: string
      protocol_version:
        default: ""
        type: string
      runner:
        description: GitHub Actions runner label
        required: true
        type: string

permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: write

jobs:
  variations_test_gate:
    name: Variations Test Gate
    runs-on: ${{ inputs.runner }}
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            .circleci/github-users-forcing-variations-tests.txt
          sparse-checkout-cone-mode: false

      - name: Decide if variations tests should run
        id: gate
        shell: bash
        env:
          ONLY_FOR_SELECTED_USERS: ${{ inputs.only_for_selected_users }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$ONLY_FOR_SELECTED_USERS" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Fxq "$PR_AUTHOR" .circleci/github-users-forcing-variations-tests.txt; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  variations_test:
    name: Variations Test (shard ${{ matrix.shard }})
    needs: variations_test_gate
    if: ${{ needs.variations_test_gate.outputs.should_run == 'true' }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      EXECUTOR_JVM_HEAP_SIZE: 14000M
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with: {fetch-depth: 0}

      - name: Start Postgres container
        id: postgres
        uses: ./.github/actions/utils/postgres/start_postgres_container_standard
        with:
          shard-index: ${{ matrix.shard }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set Canton Protocol Version
        if: ${{ inputs.protocol_version != '' }}
        env:
          CANTON_PROTOCOL_VERSION: ${{ inputs.protocol_version }}
        run: |
          echo "CANTON_PROTOCOL_VERSION=$CANTON_PROTOCOL_VERSION" >> "$GITHUB_ENV"
          echo "Canton will use protocol version $CANTON_PROTOCOL_VERSION"
        shell: bash

      - name: Prepare test inputs and timings
        uses: ./.github/actions/test/prepare_test_inputs_with_timings
        with:
          timings-artifact-name: ${{ github.job }}-timings-latest
          timings-path: ${{ github.job }}/.timings
          github-token: ${{ github.token }}

      - name: Run variations test
        uses: ./.github/actions/test/run_variations_tests
        with:
          exclude_unstable_tests: "true"
          execution_context_size: '8'
          num_test_buckets: "4"
          override_java_version_for_tests: ${{ inputs.override_java_version_for_tests }}
          shard_index: ${{ matrix.shard }}
          test_file: test-full-class-names.log
          timings_file: ${{ github.job }}/.timings/timings.json

  aggregate_shard_outputs:
    name: Aggregate Shard Outputs
    needs: variations_test
    if: ${{ always() && needs.variations_test.result != 'skipped' }}
    uses: ./.github/workflows/_aggregate_test_shard_outputs.yml
    with:
      caller_job: variations_test
      runner: ${{ inputs.runner }}
      protocol_version: ${{ inputs.protocol_version }}
    secrets: inherit
