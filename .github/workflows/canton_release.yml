name: Canton Release
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - 'release-line-*'
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

jobs:
  # RELEASE_REPOSITORY holds the same value in DACH-NY/canton and digital-asset/canton:
  # the repo that tags and publishes. Unset would silently skip every job below.
  check_release_repository:
    name: Check release repository
    if: ${{ vars.RELEASE_REPOSITORY == '' && contains(fromJSON('["DACH-NY/canton", "digital-asset/canton"]'), github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if RELEASE_REPOSITORY is unset
        run: |
          msg="Set the RELEASE_REPOSITORY repository variable to the repo that publishes releases,"
          msg+=" with the same value in DACH-NY/canton and digital-asset/canton."
          echo "::error::$msg"
          exit 1

  pick_runner:
    name: Pick runner
    if: ${{ github.repository == vars.RELEASE_REPOSITORY }}
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick_runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - id: pick_runner
        uses: ./.github/actions/utils/pick_runner

  compile:
    name: Compile
    needs: pick_runner
    uses: ./.github/workflows/_compile.yml
    secrets: inherit
    with:
      reset_classes_if_requested: true
      runner: ${{ needs.pick_runner.outputs.runner }}

  package_community:
    name: Package Community
    needs: [pick_runner, compile]
    uses: ./.github/workflows/_package_community.yml
    secrets: inherit
    with:
      is_nightly_workflow: false
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  build_scaladoc:
    name: Build Scaladoc
    needs: [pick_runner, compile]
    uses: ./.github/workflows/_build_scaladoc.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  package_jsonapi:
    name: Package JSON API
    needs: [pick_runner, compile]
    uses: ./.github/workflows/_package_jsonapi.yml
    secrets: inherit
    with:
      is_nightly_workflow: false
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  package_kms_driver:
    name: Package KMS Driver
    needs: [pick_runner, compile]
    uses: ./.github/workflows/_package_kms_driver.yml
    secrets: inherit
    with:
      is_nightly_workflow: false
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  assembly_ledger_api_test_tool:
    name: Assembly Ledger API Test Tool
    needs: [pick_runner, compile]
    uses: ./.github/workflows/_assembly_ledger_api_test_tool.yml
    secrets: inherit
    with:
      is_nightly_workflow: false
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  generate_data_continuity_dumps:
    name: Generate Data Continuity Dumps
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pick_runner, compile]
    uses: ./.github/workflows/_generate_data_continuity_dumps.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      is_nightly_workflow: false
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  tag_new_releases:
    name: Tag New Releases
    if: ${{ github.repository == vars.RELEASE_REPOSITORY && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-line-')) }}
    needs: pick_runner
    uses: ./.github/workflows/_tag_new_releases.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  release_test:
    name: Release Test
    needs: [pick_runner, package_community, package_kms_driver]
    uses: ./.github/workflows/_release_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      is_nightly_workflow: false
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  build_and_publish_docker:
    name: Build and Publish Docker
    if: ${{ github.repository == vars.RELEASE_REPOSITORY && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [pick_runner, package_community, release_test]
    uses: ./.github/workflows/_build_and_publish_docker.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    secrets: inherit
    with:
      is_nightly_workflow: false
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  publish_libraries:
    name: Publish Libraries
    needs: [pick_runner, compile, tag_new_releases]
    if: >
      always() &&
      !cancelled() &&
      needs.compile.result == 'success' &&
      (needs.tag_new_releases.result == 'success' || needs.tag_new_releases.result == 'skipped') &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/_publish_libraries.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      is_nightly_workflow: false
      is_manual: false

  publish_release:
    name: Publish Release
    needs:
      - pick_runner
      - package_community
      - package_jsonapi
      - package_kms_driver
      - assembly_ledger_api_test_tool
      - build_scaladoc
      - compile
      - release_test
      - tag_new_releases
    if: >
      always() &&
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.compile.result == 'success' &&
      (needs.tag_new_releases.result == 'success' || needs.tag_new_releases.result == 'skipped') &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/_publish_release.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      is_nightly_workflow: false
      is_manual: false

  verify_publish_release:
    name: Verify Publish Release
    needs: publish_release
    if: >-
      github.repository == vars.RELEASE_REPOSITORY &&
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Fail if publish_release was skipped
        env:
          PUBLISH_RELEASE_RESULT: ${{ needs.publish_release.result }}
        run: |
          if [[ "$PUBLISH_RELEASE_RESULT" == "skipped" ]]; then
            echo "::error::publish_release skipped on tag release"
            exit 1
          fi

  run_propose_script:
    name: Update main after release
    # Release candidates (v3.8.0-rc1) have no release notes to copy to main.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs:
      - pick_runner
      - publish_libraries
      - publish_release
    uses: ./.github/workflows/_run_propose_script.yml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      script_argument: finish_release_process

  notify:
    name: Notify on Failure
    needs:
      - check_release_repository
      - pick_runner
      - compile
      - package_community
      - build_scaladoc
      - package_jsonapi
      - package_kms_driver
      - assembly_ledger_api_test_tool
      - build_and_publish_docker
      - publish_libraries
      - publish_release
      - verify_publish_release
      - release_test
      - tag_new_releases
      - run_propose_script
      - generate_data_continuity_dumps
    if: |
      always() &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    uses: ./.github/workflows/_notify.yml
    secrets: inherit
    with:
      needs_json: ${{ toJSON(needs) }}
