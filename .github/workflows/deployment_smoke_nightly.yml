name: Deployment Smoke Nightly
# TODO(#34877): move into canton_nightly.yml once that workflow is scheduled.
on:
  schedule:
    - cron: '0 6 * * 1-5' # Every workday at 06:00 UTC, on the newest snapshot published so far
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pick_runner:
    name: Pick runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick_runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - id: pick_runner
        uses: ./.github/actions/utils/pick_runner

  deployment_smoke_latest_snapshot:
    name: Deployment Smoke on Latest Snapshot
    needs: pick_runner
    runs-on: ${{ needs.pick_runner.outputs.runner }}
    if: github.repository == 'DACH-NY/canton'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
        with:
          driver: docker

      - name: Deployment smoke (incl. PQS) on latest snapshot images
        uses: ./.github/actions/nix/nix_run
        with:
          command: ./docker/canton/tests/ping/run_latest_snapshot.sh

      - name: Store artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-smoke-logs
          path: docker/canton/tests/ping/ci-artifacts/compose-logs

  # PoC: failures DM the smoke owner only. Switch to ./.github/workflows/_notify.yml
  # once the smoke is stable, with its runner hardcoded like pick_runner's so the
  # alert still fires when pick_runner itself fails.
  notify_owner:
    name: Notify owner on Failure
    needs:
      - pick_runner
      - deployment_smoke_latest_snapshot
    if: |
      always() && github.repository == 'DACH-NY/canton' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Send Slack DM
        env:
          SLACK_BOT_QA_NOTIFICATIONS: ${{ secrets.SLACK_BOT_QA_NOTIFICATIONS }}
          OWNER_SLACK_ID: U0AHRL04HPV # Thibault Bene
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        shell: bash
        run: |
          python3 - <<'EOF'
          import os
          import sys

          sys.path.insert(0, "scripts/ci")
          from select_rota import send_dm

          send_dm(
              os.environ["SLACK_BOT_QA_NOTIFICATIONS"],
              os.environ["OWNER_SLACK_ID"],
              f":red_circle: Deployment smoke nightly failed: {os.environ['RUN_URL']}",
          )
          EOF
