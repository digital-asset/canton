name: Check release notes

# For PRs targeting main or a release-line* branch this check is REQUIRED: it
# fails unless UNRELEASED.md is updated. PRs that legitimately need no release
# note (forward-ports, CI-only, docs) can bypass with the "no-release-note"
# label.
#
# Either way the check posts a single "sticky" PR comment (updated in place,
# cleared/marked passed when the check passes) so the guidance is visible inline
# rather than only as a check result. Implemented with actions/github-script
# since the job only interacts with the GitHub API.
on:
  pull_request:
    branches:
      - 'release-line*'
      - 'main'
    # labeled/unlabeled so toggling the skip label re-evaluates the check.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # main merges through a merge queue. A required status check must also report in
  # the merge_group context, otherwise the queue entry waits forever for a result
  # that never arrives and stalls everything behind it. The job runs here too and
  # passes immediately, since the PR-level run already enforced the gate before the
  # PR entered the queue.
  merge_group:

# Cancel superseded runs on the same PR so only the latest commit's run posts the
# sticky comment / status, avoiding racing runs that leave a stale comment.
concurrency:
  # Falls back to github.ref on merge_group, where pull_request.number is empty, so
  # queue entries do not collapse into one group and cancel each other.
  group: check-unreleased-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pick_runner:
    name: Pick runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick_runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - id: pick_runner
        uses: ./.github/actions/utils/pick_runner

  check-unreleased:
    name: Require UNRELEASED.md update
    needs: pick_runner
    runs-on: ${{ needs.pick_runner.outputs.runner }}
    permissions:
      contents: read
      # write so same-repo PRs can post the sticky comment (fork PRs are read-only
      # regardless, see writeSticky).
      pull-requests: write
      issues: write
    steps:
      - name: Require UNRELEASED.md update
        uses: actions/github-script@v9
        with:
          script: |
            const SKIP_LABEL = 'no-release-note';
            const RELEASE_NOTES_FILE = 'UNRELEASED.md';
            const MARKER = '<!-- check-unreleased-notes -->';

            // Nothing to inspect in the merge queue: the gate already ran on the PR
            // before it entered the queue. Return success so the required check
            // reports a result and the queue does not stall.
            if (context.eventName === 'merge_group') {
              core.info('merge_group event: release-notes gate already enforced on the PR, passing.');
              return;
            }

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const labels = pr.labels.map(l => l.name);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const touched = files.some(f => f.filename === RELEASE_NOTES_FILE);
            const skipped = labels.includes(SKIP_LABEL);
            const ok = touched || skipped;

            // This check is a required gate on every branch it runs on (main and
            // release-line*): it fails when the release note is missing and no
            // skip label is present.

            // Diagnostics: record event + mergeability on every run so that, if a
            // PR ever stalls (required check left with no result on its head), we
            // have a forensic trail. The pull_request payload omits mergeable /
            // mergeable_state, so re-fetch the PR to capture them.
            let mergeable = null, mergeable_state = null, draft = pr.draft;
            try {
              const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
              mergeable = fresh.mergeable;
              mergeable_state = fresh.mergeable_state;
              draft = fresh.draft;
            } catch (e) {
              core.warning(`pulls.get failed: ${e.message}`);
            }
            const diag = {
              event: context.eventName, action: context.payload.action,
              pr: pr.number, head: pr.head.sha, base: pr.base.ref,
              draft, mergeable, mergeable_state, labels, touched, skipped, ok,
            };
            core.info(`release-notes-check diagnostics: ${JSON.stringify(diag)}`);
            await core.summary
              .addHeading('Release-notes check', 3)
              .addTable([
                [{ data: 'field', header: true }, { data: 'value', header: true }],
                ['decision', ok ? '✅ pass' : '⚠️ fail'],
                ['event', `${diag.event} / ${diag.action}`],
                ['head', diag.head],
                ['base', diag.base],
                ['mergeable', String(mergeable)],
                ['mergeable_state', String(mergeable_state)],
                ['draft', String(draft)],
                ['UNRELEASED.md touched', String(touched)],
                ['no-release-note label', String(skipped)],
              ])
              .write();

            // Find a sticky comment posted by a previous run (by hidden marker).
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const sticky = comments.find(c => c.body && c.body.includes(MARKER));

            // Fork PRs get a read-only token, so comment writes 403. Keep them
            // best-effort: the check still fails via setFailed, we just skip the
            // sticky comment when the token cannot post it.
            async function writeSticky(commentBody, createIfMissing) {
              try {
                if (sticky) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: sticky.id, body: commentBody });
                } else if (createIfMissing) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: commentBody });
                }
              } catch (e) {
                core.warning(`Could not post the sticky release-notes comment (likely a fork PR with a read-only token): ${e.message}`);
              }
            }

            const missingBody =
              `${MARKER}\n⚠️ **Release note required.** This PR targets \`${pr.base.ref}\` but does not ` +
              `modify \`${RELEASE_NOTES_FILE}\`.\n\nPlease add a release note to \`${RELEASE_NOTES_FILE}\`, ` +
              `or apply the \`${SKIP_LABEL}\` label if this change needs none (e.g. forward-port, CI-only, docs).`;
            const body = ok ? `${MARKER}\n✅ Release-notes check passed.` : missingBody;

            if (ok) {
              // Only update an existing comment; never add noise to a clean PR.
              await writeSticky(body, false);
              core.notice(touched ? `${RELEASE_NOTES_FILE} was updated.` : `'${SKIP_LABEL}' label present; skipping.`);
              return;
            }

            await writeSticky(body, true);
            core.setFailed(
              `This PR targets '${pr.base.ref}' but does not modify ${RELEASE_NOTES_FILE}. ` +
              `Add a release note, or apply the '${SKIP_LABEL}' label if this change needs none (e.g. forward-port, CI-only, docs).`
            );
