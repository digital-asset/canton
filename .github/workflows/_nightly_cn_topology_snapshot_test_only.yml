name: Nightly CN Topology Snapshot Test Only
on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label
        required: true
        type: string
    secrets:
      DATADOG_API_KEY:
        required: true
      GCLOUD_SERVICE_KEY:
        required: true

permissions:
  contents: read
  actions: write
  id-token: write
  issues: write

jobs:
  resolve_timings:
    name: Resolve Timings Artifact Run
    # One repo-wide artifact lookup for the whole matrix instead of one per shard,
    # so the shared GITHUB_TOKEN rate-limit budget is not drained at run start.
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.resolve.outputs.run-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions/utils/resolve_previous_artifact_run
          sparse-checkout-cone-mode: false

      - name: Resolve previous timings artifact run
        id: resolve
        # Best-effort. If the lookup is rate limited the shards just fall back to
        # unbalanced splitting rather than failing the run.
        continue-on-error: true
        uses: ./.github/actions/utils/resolve_previous_artifact_run
        with:
          artifact-name: nightly_cn_topology_snapshot_test_only-timings-latest

  nightly_cn_topology_snapshot_test_only:
    name: Nightly CN Topology Snapshot Test Only (shard ${{ matrix.shard }})
    needs: resolve_timings
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 270
    env:
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
      EXECUTOR_JVM_HEAP_SIZE: 20000M
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with: {fetch-depth: 0}

      - name: Start Postgres container
        id: start_postgres
        uses: ./.github/actions/utils/postgres/start_postgres_container_standard
        with:
          shard-index: ${{ matrix.shard }}

      - name: Set Automatic Protocol Version
        uses: ./.github/actions/test/set_automatic_protocol_version

      - name: Prepare test inputs and timings
        uses: ./.github/actions/test/prepare_test_inputs_with_timings
        with:
          timings-artifact-name: ${{ github.job }}-timings-latest
          timings-path: ${{ github.job }}/.timings
          github-token: ${{ github.token }}
          previous-timings-run-id: ${{ needs.resolve_timings.outputs.run-id }}
          previous-timings-resolved: "true"

      - name: Setup GCP credentials for Topology Snapshot Tests
        uses: ./.github/actions/test/setup_gcp_topology
        with:
          service_account_key: ${{ env.GCLOUD_SERVICE_KEY }}

      - name: Run Nightly CN Topology Snapshot Tests
        uses: ./.github/actions/test/run_tests
        with:
          command: >-
            dumpClassPath "$RUN_SPLITTED_TESTS_CMD -- -l UnstableTest -l com.digitalasset.canton.annotations.UnstableTest" checkErrors
          fail_on_error_in_output: 'false'
          num_test_buckets: '4'
          shard_index: ${{ matrix.shard }}
          num_parallel_tasks: '1'
          include_patterns: ^com\.digitalasset\.canton\.integration\.tests\.nightly\.topology
          setup_gcp_kms: 'false'
          test_file: test-full-class-names.log
          timings_file: ${{ github.job }}/.timings/timings.json
          timeout: '240m'
          max_single_test_minutes: '240'
          rerun_max_single_test_minutes: '240'

      - name: Stop Postgres container
        if: always()
        uses: ./.github/actions/utils/postgres/stop_postgres_container
        with:
          container-name: ${{ steps.start_postgres.outputs.container-name }}

  aggregate_shard_outputs:
    name: Aggregate Shard Outputs
    needs: nightly_cn_topology_snapshot_test_only
    if: always()
    uses: ./.github/workflows/_aggregate_test_shard_outputs.yml
    with:
      caller_job: nightly_cn_topology_snapshot_test_only
      protocol_version: ''
      shard_job_result: ${{ needs.nightly_cn_topology_snapshot_test_only.result }}
