name: Canton Build Required
on:
  push:
    branches:
      - 'main'
      - 'release-line*'
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      test_to_run_many_times:
        type: boolean
        default: false
      manual_job:
        type: string
        default: none

# On main and release-line branches, each run gets a unique concurrency group (based on run_id),
# so runs never cancel or wait for each other.
# A PR push or conversion to draft supersedes older work. A promotion or full-suite request
# queues behind the active run so that completed draft results are available to the planner.
concurrency:
  group: >-
    ${{
      case(
        github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci:full', github.run_id,
        github.event_name == 'pull_request', format('{0}-pr-{1}', github.workflow, github.event.pull_request.number),
        github.event_name == 'merge_group', github.run_id,
        github.ref_name == 'main', github.run_id,
        startsWith(github.ref_name, 'release-line'), github.run_id,
        format('{0}-{1}', github.workflow, github.ref_name)
      )
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' && (github.event.action == 'synchronize' || github.event.action == 'converted_to_draft') }}

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read

jobs:
  pick_runner:
    name: Pick runner
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick_runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - id: pick_runner
        uses: ./.github/actions/utils/pick_runner

  plan_ci:
    name: Plan CI
    needs: pick_runner
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      DRAFT_ONLY: >-
        ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci:full') }}
      RECEIPT_NAME: draft-ci-v1-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
    outputs:
      draft-only: ${{ steps.plan.outputs.draft-only }}
      receipt-name: ${{ env.RECEIPT_NAME }}
      reuse-test-37: ${{ steps.plan.outputs.reuse-test-37 }}
      reuse-crash-recovery-37: ${{ steps.plan.outputs.reuse-crash-recovery-37 }}
    steps:
      - name: Find draft test results for this merge commit
        id: lookup
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && !contains(github.event.pull_request.labels.*.name, 'ci:full')
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'canton_build_required.yml',
              event: 'pull_request',
              head_sha: pr.head.sha,
              status: 'completed',
              per_page: 10,
            });
            for (const run of data.workflow_runs) {
              if (run.id === context.runId || run.head_repository?.id !== pr.head.repo.id || run.head_branch !== pr.head.ref) continue;
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id, name: process.env.RECEIPT_NAME,
              });
              if (artifacts.artifacts.some(artifact => artifact.name === process.env.RECEIPT_NAME && !artifact.expired)) {
                core.setOutput('run-id', String(run.id));
                break;
              }
            }

      - name: Download draft test results
        id: download
        if: steps.lookup.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.RECEIPT_NAME }}
          path: ${{ runner.temp }}/canton-draft-ci
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Select tests and report reused results
        id: plan
        uses: actions/github-script@v9
        env:
          RECEIPT_RUN: ${{ steps.download.outcome == 'success' && steps.lookup.outputs.run-id || '' }}
          RECEIPT_PATH: ${{ runner.temp }}/canton-draft-ci/passed.json
        with:
          script: |
            const fs = require('node:fs');
            let passed = [];
            if (process.env.RECEIPT_RUN) {
              try {
                const receipt = JSON.parse(fs.readFileSync(process.env.RECEIPT_PATH, 'utf8'));
                if (receipt.key === process.env.RECEIPT_NAME && Array.isArray(receipt.passed)) passed = receipt.passed;
              } catch (error) {
                core.warning(`Could not read draft test results: ${error.message}`);
              }
            }
            const reuse = {
              'test-37': passed.includes('test_37'),
              'crash-recovery-37': passed.includes('crash_recovery_test_37'),
            };
            core.setOutput('draft-only', process.env.DRAFT_ONLY);
            for (const [job, reused] of Object.entries(reuse)) core.setOutput(`reuse-${job}`, String(reused));
            core.summary.addHeading(process.env.DRAFT_ONLY === 'true' ? 'Draft CI' : 'Full CI');
            const reused = Object.keys(reuse).filter(job => reuse[job]);
            if (reused.length) {
              const url = `${context.serverUrl}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.RECEIPT_RUN}`;
              core.summary.addRaw(`Reused ${reused.join(', ')} from [draft run](${url}).`, true);
            }
            await core.summary.write();

  setup_and_validation:
    name: Setup nix and Validate skip-ci label and yaml files
    needs: [pick_runner, plan_ci]
    uses: ./.github/workflows/_setup_and_validation.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      draft_only: ${{ needs.plan_ci.outputs.draft-only == 'true' }}

  static_tests:
    name: Static Tests
    needs: [pick_runner, plan_ci, setup_and_validation]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      needs.setup_and_validation.outputs.should-skip != 'true' &&
      (inputs.test_to_run_many_times != true || github.event_name != 'workflow_call') &&
      (inputs.manual_job == 'none' || github.event_name != 'workflow_call')
    uses: ./.github/workflows/_static_tests.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  compile:
    name: Compile
    needs: [pick_runner, setup_and_validation]
    if: |
      (
        needs.setup_and_validation.outputs.should-skip != 'true' &&
        (inputs.test_to_run_many_times != true || github.event_name != 'workflow_call') &&
        (inputs.manual_job == 'none' || github.event_name != 'workflow_call')
      ) &&
      (
        github.ref_type == 'branch' ||
        (
          github.ref_type == 'tag' &&
          startsWith(github.ref, 'refs/tags/v')
        )
      )
    uses: ./.github/workflows/_compile.yml
    secrets: inherit
    with:
      # The compile job opts into a cold rebuild, which reset_compile_cache.sh
      # only honours on force-recompile branches (main, release lines). Test jobs
      # leave this false, so on those branches only compile rebuilds cold and the
      # test shards restore the freshly repopulated cache.
      reset_classes_if_requested: true
      runner: ${{ needs.pick_runner.outputs.runner }}

  test_36:
    name: Test protocol version 36
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group'
    uses: ./.github/workflows/_test.yml
    secrets: inherit
    with:
      include_only_requires_external_kms_tests: false
      override_java_version_for_tests: ""
      protocol_version: '36'
      job_name: test
      runner: ${{ needs.pick_runner.outputs.runner }}

  test_36_requires_external_kms:
    name: Test protocol version 36 (RequiresExternalKms)
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_test.yml
    secrets: inherit
    with:
      include_only_requires_external_kms_tests: true
      override_java_version_for_tests: ""
      protocol_version: '36'
      job_name: test_requires_external_kms
      runner: ${{ needs.pick_runner.outputs.runner }}

  build_docs:
    name: Build Docs
    needs:
      - pick_runner
      - build_docs_snippets
      - build_scaladoc
      - package_community
    if: |
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/release-line') ||
        startsWith(github.ref, 'refs/tags/v')
      )
    uses: ./.github/workflows/_build_docs.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  build_docs_snippets:
    name: Build Docs Snippets
    needs: [pick_runner, compile]
    if: |
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/release-line') ||
        startsWith(github.ref, 'refs/tags/v')
      )
    uses: ./.github/workflows/_build_docs_snippets.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  build_scaladoc:
    name: Build Scaladoc
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group'
    uses: ./.github/workflows/_build_scaladoc.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  crash_recovery_test_36:
    name: Crash Recovery Test 36
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group'
    uses: ./.github/workflows/_crash_recovery_test.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'

  crash_recovery_test_36_requires_external_kms:
    name: Crash Recovery Test 36 (RequiresExternalKms)
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_crash_recovery_test.yml
    secrets: inherit
    with:
      include_only_requires_external_kms_tests: true
      job_name: crash_recovery_test_requires_external_kms
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'

  ledger_api_compatibility_tests_36:
    name: Ledger API Compatibility Tests
    needs: [pick_runner, compile]
    # Not on main: main gets this coverage from the nightly run (#36151).
    if: |
      github.event_name == 'push' &&
      (
        startsWith(github.ref, 'refs/heads/release-line') ||
        startsWith(github.ref, 'refs/tags/v')
      )
    uses: ./.github/workflows/_ledger_api_compatibility_tests.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'

  package_community:
    name: Package Community
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group'
    uses: ./.github/workflows/_package_community.yml
    secrets: inherit
    with:
      is_nightly_workflow: false
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  protobuf_continuity:
    name: Protobuf Continuity
    needs: [pick_runner, plan_ci, compile]
    # Intentional: keep this job branch-only.
    # Protobuf continuity is a static source-level check (`sbt protobufContinuityCheck`), so
    # running it again on a release tag would be redundant with the branch/release-line commit
    # that the tag points to. We still exclude merge-queue branches, matching the historical
    # CircleCI behavior that was migrated to GitHub Actions.
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group' && github.ref_type != 'tag'
    uses: ./.github/workflows/_protobuf_continuity.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  size_config_up_to_date:
    name: Size Config Up To Date
    needs: [pick_runner, plan_ci, compile]
    # Regenerates the size-config classes and compares them with the checked-in ones, so the result
    # depends only on the commit's sources. It is not rerun on release tags (the tagged commit was
    # already checked on its branch).
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.ref_type != 'tag'
    uses: ./.github/workflows/_size_config_up_to_date.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  protocol_continuity_test_latest:
    name: Protocol Continuity Test Latest
    needs: [pick_runner, plan_ci, compile]
    # Intentional: unlike protobuf_continuity, this integration-style continuity job also runs on
    # release tags. Release tags are part of the published release validation flow, so we keep the
    # explicit `v*` tag clause here, matching the historical CircleCI behavior that was migrated to
    # GitHub Actions.
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group'
    uses: ./.github/workflows/_protocol_continuity_test_latest.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  scalafix:
    name: Scalafix
    needs: [pick_runner, plan_ci, compile]
    if: needs.plan_ci.outputs.draft-only != 'true'
    uses: ./.github/workflows/_scalafix.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  sequential_test_36:
    name: Sequential Test
    if: github.event_name == 'push'
    needs: [pick_runner, compile]
    uses: ./.github/workflows/_sequential_test.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'

  smoke_test:
    name: Smoke Test
    needs: [pick_runner, compile]
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/_smoke_test.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  test_data_continuity_dumps:
    name: Test Data Continuity Dumps
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group' && github.ref_type != 'tag'
    uses: ./.github/workflows/_test_data_continuity_dumps.yml
    # Full coverage on main and release-line branches, scoped down on regular PR branches. A PR
    # targeting a release-line still gets full coverage from the push to the release-line branch
    # once it merges, right before the release that usually follows.
    with:
      full_coverage: >-
        ${{
          github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          (github.ref_name == 'main' || startsWith(github.ref_name, 'release-line'))
        }}
      runner: ${{ needs.pick_runner.outputs.runner }}
    secrets: inherit

  test_docker_images:
    name: Test Docker Images
    needs: [pick_runner, plan_ci, package_community]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group'
    uses: ./.github/workflows/_test_docker_images.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  test_37:
    name: Test Protocol Version 37
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.reuse-test-37 != 'true' &&
      github.event_name != 'merge_group' && github.ref_type != 'tag'
    uses: ./.github/workflows/_test.yml
    secrets: inherit
    with:
      protocol_version: '37'
      job_name: test_37
      runner: ${{ needs.pick_runner.outputs.runner }}

  test_37_requires_external_kms:
    name: Test Protocol Version 37 (RequiresExternalKms)
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group' &&
      github.ref_type != 'tag'  &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_test.yml
    secrets: inherit
    with:
      include_only_requires_external_kms_tests: true
      protocol_version: '37'
      job_name: test_protocol_version_37_requires_external_kms
      runner: ${{ needs.pick_runner.outputs.runner }}

  crash_recovery_test_37:
    name: Crash Recovery Test 37
    needs: [pick_runner, plan_ci, compile]
    if: github.event_name == 'pull_request' && needs.plan_ci.outputs.reuse-crash-recovery-37 != 'true'
    uses: ./.github/workflows/_crash_recovery_test.yml
    secrets: inherit
    with:
      job_name: crash_recovery_test_37
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '37'

  test_dev:
    name: Test Protocol Version Dev
    needs: [pick_runner, compile]
    if: github.event_name == 'push'
    uses: ./.github/workflows/_test.yml
    secrets: inherit
    with:
      protocol_version: 'DEV'
      job_name: test_dev
      runner: ${{ needs.pick_runner.outputs.runner }}

  toxiproxy_test_fast_36:
    name: Toxiproxy Test Fast 36
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group'
    uses: ./.github/workflows/_toxiproxy_test_fast.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'

  toxiproxy_test_fast_36_requires_external_kms:
    name: Toxiproxy Test Fast 36 (RequiresExternalKms)
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name != 'merge_group'  &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_toxiproxy_test_fast.yml
    secrets: inherit
    with:
      include_only_requires_external_kms_tests: true
      job_name: toxiproxy_test_fast_requires_external_kms
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'

  unstable_test_36:
    name: Unstable Test 36
    needs: [pick_runner, package_community]
    if: github.event_name == 'push'
    uses: ./.github/workflows/_unstable_test.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'

  variations_test_36:
    name: Variations Test 36
    needs: [pick_runner, compile]
    if: github.event_name == 'push'
    uses: ./.github/workflows/_variations_test.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'

  variations_test_36_selected_users:
    name: Variations Test 36 (Selected Users)
    needs: [pick_runner, plan_ci, compile]
    if: |
      needs.plan_ci.outputs.draft-only != 'true' &&
      github.event_name == 'pull_request'
    uses: ./.github/workflows/_variations_test.yml
    secrets: inherit
    with:
      only_for_selected_users: true
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'

  publish_draft_results:
    name: Publish draft test results
    needs: [plan_ci, test_37, crash_recovery_test_37]
    if: >-
      ${{ !cancelled() && needs.plan_ci.outputs.draft-only == 'true' &&
          (needs.test_37.result == 'success' || needs.crash_recovery_test_37.result == 'success') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record completed test families
        shell: bash
        env:
          RECEIPT_NAME: ${{ needs.plan_ci.outputs.receipt-name }}
          TEST_37: ${{ needs.test_37.result }}
          CRASH_RECOVERY_37: ${{ needs.crash_recovery_test_37.result }}
        run: |
          jq -n --arg key "$RECEIPT_NAME" --arg test "$TEST_37" --arg crash "$CRASH_RECOVERY_37" \
            '{key: $key, passed: ({test_37: $test, crash_recovery_test_37: $crash} | to_entries | map(select(.value == "success").key))}' \
            > "$RUNNER_TEMP/passed.json"

      - name: Upload draft test results
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ needs.plan_ci.outputs.receipt-name }}
          path: ${{ runner.temp }}/passed.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  notify:
    name: Notify on Failure
    needs:
      - pick_runner
      - plan_ci
      - setup_and_validation
      - static_tests
      - compile
      - test_36
      - test_36_requires_external_kms
      - build_docs
      - build_docs_snippets
      - build_scaladoc
      - crash_recovery_test_36
      - crash_recovery_test_36_requires_external_kms
      - ledger_api_compatibility_tests_36
      - package_community
      - protobuf_continuity
      - size_config_up_to_date
      - protocol_continuity_test_latest
      - scalafix
      - sequential_test_36
      - smoke_test
      - test_data_continuity_dumps
      - test_docker_images
      - test_37
      - test_37_requires_external_kms
      - crash_recovery_test_37
      - test_dev
      - toxiproxy_test_fast_36
      - toxiproxy_test_fast_36_requires_external_kms
      - unstable_test_36
      - variations_test_36
      - variations_test_36_selected_users
      - publish_draft_results
    if: |
      always() &&
      github.event_name == 'push' &&
      (
        contains(needs.*.result, 'failure') ||
        contains(needs.*.result, 'cancelled')
      )
    uses: ./.github/workflows/_notify.yml
    secrets: inherit
    with:
      needs_json: ${{ toJSON(needs) }}
      # Keep required-notify runner selection independent from pick_runner output to avoid
      # issues with notify if pick_runner fails before emitting outputs.
      # Keep repo-to-runner labels in sync with .github/actions/utils/pick_runner/action.yml.
      runner: >-
        ${{
          case(
            github.repository == 'DACH-NY/canton', 'dach-ny-canton',
            github.repository == 'digital-asset/canton', 'digital-asset-canton',
            'ubuntu-latest'
          )
        }}

  canton_build_required_gate:
    # Draft runs report separately so their partial coverage cannot satisfy branch protection.
    name: >-
      ${{
        case(
          github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci:full',
            'Canton CI (unrelated label)',
          github.event_name == 'pull_request' && github.event.pull_request.draft, 'Canton Draft Build Gate',
          'Canton Build Required Gate'
        )
      }}
    needs:
      - pick_runner
      - plan_ci
      - setup_and_validation
      - static_tests
      - compile
      - test_36
      - test_36_requires_external_kms
      - build_docs
      - build_docs_snippets
      - build_scaladoc
      - crash_recovery_test_36
      - crash_recovery_test_36_requires_external_kms
      - ledger_api_compatibility_tests_36
      - package_community
      - protobuf_continuity
      - size_config_up_to_date
      - protocol_continuity_test_latest
      - scalafix
      - sequential_test_36
      - smoke_test
      - test_data_continuity_dumps
      - test_docker_images
      - test_37
      - test_37_requires_external_kms
      - crash_recovery_test_37
      - test_dev
      - toxiproxy_test_fast_36
      - toxiproxy_test_fast_36_requires_external_kms
      - unstable_test_36
      - variations_test_36
      - variations_test_36_selected_users
      - publish_draft_results
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci:full') }}
    # Keep required-gate runner selection independent from pick_runner output to avoid
    # stalling merge queue if pick_runner fails before emitting outputs.
    # Keep repo-to-runner labels in sync with .github/actions/utils/pick_runner/action.yml.
    runs-on: >-
      ${{
        case(
          github.repository == 'DACH-NY/canton', 'dach-ny-canton',
          github.repository == 'digital-asset/canton', 'digital-asset-canton',
          'ubuntu-latest'
        )
      }}
    steps:
      # Required before the local nix_script_run action below: a `uses: ./...` action is only
      # resolvable once the repository is present in the runner workspace.
      - name: Checkout
        uses: actions/checkout@v5
      - name: Evaluate workflow results
        uses: ./.github/actions/nix/nix_script_run
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        with:
          command: |
            python3 <<'PY'
            import json
            import os
            import sys

            needs = json.loads(os.environ["NEEDS_JSON"])

            # The `skip ci` label short-circuits every other job in this workflow to
            # "skipped" via setup_and_validation's should-skip output, which the
            # failure check below would otherwise treat as a pass. Fail here instead,
            # so a skip-ci'd PR can only merge through an explicit branch-protection
            # bypass rather than a silently green required check.
            should_skip = (
                needs.get("setup_and_validation", {}).get("outputs", {}).get("should-skip")
                == "true"
            )
            if should_skip:
                print(
                    "The 'skip ci' label is set, so required jobs did not run. "
                    "Failing this check intentionally: merging requires a branch-protection bypass."
                )
                sys.exit(1)

            failed_or_interrupted = {
                job_name: job_data.get("result")
                for job_name, job_data in needs.items()
                if job_data.get("result") in {"failure", "cancelled"}
            }

            if failed_or_interrupted:
                print("The following jobs did not complete successfully:")
                for job_name, result in failed_or_interrupted.items():
                    print(f" - {job_name}: {result}")
                sys.exit(1)

            if os.environ["IS_PR"] == "true":
                plan = needs["plan_ci"]["outputs"]
                required = {
                    "compile": True,
                    "test_37": plan.get("reuse-test-37") != "true",
                    "crash_recovery_test_37": plan.get("reuse-crash-recovery-37") != "true",
                }
                missing = [job for job, run in required.items() if run and needs[job]["result"] != "success"]
                if missing:
                    print(f"Missing required PR coverage: {', '.join(missing)}")
                    sys.exit(1)

            print("All required canton_build_required jobs either succeeded or were skipped.")
            sys.exit(0)
            PY
