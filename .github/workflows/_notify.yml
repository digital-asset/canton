name: Notify on Failure
on:
  workflow_call:
    inputs:
      needs_json:
        required: true
        description: needs information as json string
        type: string
      runner:
        description: GitHub Actions runner label
        required: true
        type: string

jobs:
  send_notification:
    name: Send Slack Notification
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout (slack)
        # Full checkout (not sparse): select_rota.py reads the rota Google Sheet
        # and must run under .ci/nix-exec, which needs shell.nix and nix/.
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Detect failed jobs
        id: failed-jobs
        # Alert only on build/infra failures. Test-job failures are tracked by
        # the flaky pipeline. Classification lives in
        # scripts/ci/notify_job_classification.yml, guarded against drift by
        # check_canton_build_required_gate.py. nix-exec provides PyYAML.
        env:
          NEEDS_JSON: ${{ inputs.needs_json }}
        run: |
          # Fail open: if the classifier itself errors, alert rather than stay
          # silent, so a broken classifier never masks a real infra failure.
          if RESULT=$(.ci/nix-exec python3 scripts/ci/notify_job_classification.py); then
            echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          else
            echo "result=notify-classification-error (see step logs)" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Slack notification
        # Only alert when there is a nameable non-test failure. If the failed
        # list is empty, stay silent instead of posting an "unknown" alert.
        if: steps.failed-jobs.outputs.result != ''
        uses: ./.github/actions/slack/slack_red_main_with_volunteer
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_TEAM_CANTON_INTERNAL }}
          failed_job: ${{ steps.failed-jobs.outputs.result }}
          gcloud_sheets_sa_key: ${{ secrets.GCLOUD_SHEETS_SA_KEY }}
