name: Add compliance label

on:
  # Use pull_request_target so the job gets a read/write token on PRs from forks.
  # On the plain pull_request event a fork PR receives a read-only GITHUB_TOKEN and the
  # label write fails with 403. This is safe here because the job never checks out or runs
  # fork-controlled code, it only reads the changed-file list and adds a label.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  add-compliance-label:
    name: Add Standard-Change label if compliance paths are modified
    # Pure GitHub API calls, so use a GitHub-hosted runner. This keeps fork-triggered
    # pull_request_target runs off the self-hosted fleet and removes the only checkout.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check changed files and add label
        uses: actions/github-script@v9
        with:
          script: |
            const prefixes = [
              '.ci',
              '.github',
              'release',
              'scripts/ci',
              'nix',
              'shell.nix',
              'project',
              'build.sbt',
              'shared_dependencies.json',
            ];
            const exceptions = new Set([
              'project/project/DamlVersions.scala',
              '.ci/branches_to_be_fully_recompiled_in_ci.txt',
            ]);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const matchesCompliance = files
              .filter(({ filename }) => !exceptions.has(filename))
              .some(({ filename }) =>
                prefixes.some(p => filename === p || filename.startsWith(p + '/'))
              );

            if (!matchesCompliance) {
              core.info('No compliance-controlled paths modified, skipping label.');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['Standard-Change'],
            });

            core.info('Added "Standard-Change" label.');
