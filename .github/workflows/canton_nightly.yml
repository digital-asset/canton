name: Canton Nightly Workflow
on:
  # TODO(#34877): Re-enable the separate nightly scheduler after the CircleCI
  # migration is complete. Until then, this workflow only runs when dispatched on
  # a gha-migration/* branch (see pick_runner).
  workflow_dispatch:
    inputs:
      jobs:
        description: >-
          Comma-separated job ids to run, without spaces (e.g.
          toxiproxy_test_slow_36,unstable_test_slow_36). Empty runs the whole
          nightly. pick_runner, compile and package_community always run; a
          job's other needs must be selected too.
        type: string
        default: ''

jobs:
  pick_runner:
    name: Pick runner
    # Every other job needs this one, so skipping it skips the whole run and keeps
    # main and release lines (and their publish jobs) out of reach until TODO(#34877).
    if: startsWith(github.ref, 'refs/heads/gha-migration/')
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick_runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - id: pick_runner
        uses: ./.github/actions/utils/pick_runner

  # Fails a dispatch with unknown job ids, or with a job whose needs are not selected
  # (which would otherwise skip it and leave a green run where nothing executed),
  # before compile spends any time.
  validate_jobs:
    name: Validate selected jobs
    needs: pick_runner
    if: inputs.jobs != ''
    runs-on: ${{ needs.pick_runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            .ci
            shell.nix
            nix
            scripts/ci
          sparse-checkout-cone-mode: false
      - name: Validate selected jobs
        uses: ./.github/actions/nix/nix_run
        env:
          JOBS: ${{ inputs.jobs }}
        with:
          command: python3 scripts/ci/check_canton_nightly_dispatch_filter.py --validate "$JOBS"

  compile:
    name: Compile
    uses: ./.github/workflows/_compile.yml
    needs: [pick_runner, validate_jobs]
    # validate_jobs is skipped for a full run.
    if: >-
      !cancelled() && needs.pick_runner.result == 'success' &&
      needs.validate_jobs.result != 'failure'
    secrets: inherit
    with:
      # The compile job opts into a cold rebuild, which reset_compile_cache.sh
      # only honours on force-recompile branches (main and release lines), so
      # nightlies on those branches rebuild cold while every other job restores
      # the freshly repopulated cache.
      reset_classes_if_requested: true
      runner: ${{ needs.pick_runner.outputs.runner }}

  package_community:
    name: Package Community
    needs: [pick_runner, compile]
    uses: ./.github/workflows/_package_community.yml
    secrets: inherit
    with:
      is_nightly_workflow: true
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  package_kms_driver:
    name: Package KMS Driver
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',package_kms_driver,')
    uses: ./.github/workflows/_package_kms_driver.yml
    secrets: inherit
    with:
      is_nightly_workflow: true
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  build_scaladoc:
    name: Build Scaladoc
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',build_scaladoc,')
    uses: ./.github/workflows/_build_scaladoc.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  build_docs_snippets:
    name: Build Docs Snippets
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',build_docs_snippets,')
    uses: ./.github/workflows/_build_docs_snippets.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  build_docs:
    name: Build Docs
    needs:
      - build_docs_snippets
      - build_scaladoc
      - package_community
      - pick_runner
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',build_docs,')
    uses: ./.github/workflows/_build_docs.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  unstable_test_36:
    name: Unstable Test 36
    needs: [pick_runner, package_community]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',unstable_test_36,')
    uses: ./.github/workflows/_unstable_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'

  unstable_test_slow_36:
    name: Unstable Test Slow 36
    needs: [pick_runner, compile, toxiproxy_test_slow_36]
    # A full run keeps the CircleCI ordering (skipped when toxiproxy fails); when
    # dispatched without toxiproxy it runs right after compile.
    # needs.compile.result is what guarantees a built tree here: whether a skipped need
    # counts as 'failure' in contains() is undocumented (see run 44377549900).
    if: >-
      (inputs.jobs == '' && success()) ||
      (!cancelled() && needs.compile.result == 'success' &&
       !contains(needs.*.result, 'failure') &&
       contains(format(',{0},', inputs.jobs), ',unstable_test_slow_36,'))
    uses: ./.github/workflows/_unstable_test_slow.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'
      job_name: unstable_test_slow_36

  test_36_with_java17:
    name: Test 36 With Java 17
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',test_36_with_java17,')
    uses: ./.github/workflows/_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      override_java_version_for_tests: "17"
      protocol_version: "36"
      job_name: test_36_with_java17
      runner: ${{ needs.pick_runner.outputs.runner }}

  test_37_with_expensive_checks:
    name: Test 37 With Expensive Checks
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',test_37_with_expensive_checks,')
    uses: ./.github/workflows/_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      protocol_version: "37"
      job_name: test_37_with_expensive_checks
      enable_expensive_checks: true
      runner: ${{ needs.pick_runner.outputs.runner }}

  ledger_api_compatibility_tests_37:
    name: Ledger API Compatibility Tests
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',ledger_api_compatibility_tests_37,')
    uses: ./.github/workflows/_ledger_api_compatibility_tests.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '37'
      job_name: ledger_api_compatibility_test_37

  protocol_continuity_test_all:
    name: Protocol Continuity Test All
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',protocol_continuity_test_all,')
    uses: ./.github/workflows/_protocol_continuity_test_all.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  toxiproxy_test_slow_36:
    name: Toxiproxy Test Slow 36
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',toxiproxy_test_slow_36,')
    uses: ./.github/workflows/_toxiproxy_test_slow.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'
      job_name: toxiproxy_test_slow_36

  stability_crash_recovery_test_36:
    name: Stability Crash Recovery Test
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',stability_crash_recovery_test_36,')
    uses: ./.github/workflows/_stability_crash_recovery_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'
      job_name: stability_crash_recovery_test_36

  stability_crash_recovery_test_alerting:
    name: Stability Crash Recovery Test Alerting
    needs: [pick_runner, compile, stability_crash_recovery_test_36]
    if: >-
      !cancelled() &&
      (needs.stability_crash_recovery_test_36.result == 'success' ||
      needs.stability_crash_recovery_test_36.result == 'failure') &&
      (inputs.jobs == '' ||
      contains(format(',{0},', inputs.jobs), ',stability_crash_recovery_test_alerting,'))
    uses: ./.github/workflows/_stability_crash_recovery_test_alerting.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      stability_crash_recovery_test_name: stability_crash_recovery_test_36
      min_successes: 8

  package_jsonapi:
    name: Package JSON API
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',package_jsonapi,')
    uses: ./.github/workflows/_package_jsonapi.yml
    secrets: inherit
    with:
      is_nightly_workflow: true
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  assembly_ledger_api_test_tool:
    name: Assembly Ledger API Test Tool
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',assembly_ledger_api_test_tool,')
    uses: ./.github/workflows/_assembly_ledger_api_test_tool.yml
    secrets: inherit
    with:
      is_manual: false
      is_nightly_workflow: true
      runner: ${{ needs.pick_runner.outputs.runner }}

  external_parties_test_36:
    name: External Parties Test 36
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',external_parties_test_36,')
    uses: ./.github/workflows/_external_parties_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      override_java_version_for_tests: ""
      protocol_version: "36"
      job_name: external_parties_test_36
      runner: ${{ needs.pick_runner.outputs.runner }}

  nightly_integration_test_36:
    name: Nightly Integration Test 36
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',nightly_integration_test_36,')
    uses: ./.github/workflows/_nightly_integration_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'

  nightly_integration_test_with_session_keys_36:
    name: Nightly Integration Test With Session Keys 36
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',nightly_integration_test_with_session_keys_36,')
    uses: ./.github/workflows/_nightly_integration_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'
      job_name: nightly_integration_test_with_session_keys_36
      session_signing_keys_enabled: true

  # One version at a time, as on CircleCI, to cap the leg at 12 runners.
  postgres_conformance_test_15:
    name: Postgres Conformance Test 15
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',postgres_conformance_test_15,')
    uses: ./.github/workflows/_postgres_conformance_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      postgres_version: '15'
      job_name: postgres_conformance_test_15

  postgres_conformance_test_16:
    name: Postgres Conformance Test 16
    needs: [pick_runner, compile, postgres_conformance_test_15]
    # Ordered after 15 in a full run; can be dispatched alone.
    # needs.compile.result is what guarantees a built tree here: whether a skipped need
    # counts as 'failure' in contains() is undocumented (see run 44377549900).
    if: >-
      (inputs.jobs == '' && success()) ||
      (!cancelled() && needs.compile.result == 'success' &&
       !contains(needs.*.result, 'failure') &&
       contains(format(',{0},', inputs.jobs), ',postgres_conformance_test_16,'))
    uses: ./.github/workflows/_postgres_conformance_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      postgres_version: '16'
      job_name: postgres_conformance_test_16

  postgres_conformance_test_17:
    name: Postgres Conformance Test 17
    needs: [pick_runner, compile, postgres_conformance_test_16]
    # Ordered after 16 in a full run; can be dispatched alone.
    # needs.compile.result is what guarantees a built tree here: whether a skipped need
    # counts as 'failure' in contains() is undocumented (see run 44377549900).
    if: >-
      (inputs.jobs == '' && success()) ||
      (!cancelled() && needs.compile.result == 'success' &&
       !contains(needs.*.result, 'failure') &&
       contains(format(',{0},', inputs.jobs), ',postgres_conformance_test_17,'))
    uses: ./.github/workflows/_postgres_conformance_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      postgres_version: '17'
      job_name: postgres_conformance_test_17

  model_based_test_36:
    name: Model Based Test 36
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',model_based_test_36,')
    uses: ./.github/workflows/_model_based_test.yml
    permissions:
      actions: write
      contents: read
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'
      job_name: model_based_test_36

  nightly_test_upgrades_matrix_and_check:
    name: Nightly Test Upgrades Matrix And Check
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',nightly_test_upgrades_matrix_and_check,')
    uses: ./.github/workflows/_nightly_test_upgrades_matrix_and_check.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  nightly_integration_test_36_bftordering_only:
    name: Nightly Integration Test 36 BFT Ordering Only
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',nightly_integration_test_36_bftordering_only,')
    uses: ./.github/workflows/_nightly_integration_test_bftordering_only.yml
    permissions:
      actions: write
      contents: read
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '36'
      job_name: nightly_integration_test_36_bftordering_only

  build_and_publish_docker:
    name: Build and Publish Docker
    needs: [pick_runner, package_community, nightly_integration_test_36]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',build_and_publish_docker,')
    uses: ./.github/workflows/_build_and_publish_docker.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    secrets: inherit
    with:
      is_nightly_workflow: true
      is_manual: false
      runner: ${{ needs.pick_runner.outputs.runner }}

  publish_libraries:
    name: Publish Libraries
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',publish_libraries,')
    uses: ./.github/workflows/_publish_libraries.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      is_nightly_workflow: true
      is_manual: false

  publish_release:
    name: Publish Release
    needs:
      - pick_runner
      - package_community
      - build_scaladoc
      - assembly_ledger_api_test_tool
      - package_jsonapi
      - package_kms_driver
      - compile
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',publish_release,')
    uses: ./.github/workflows/_publish_release.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      is_nightly_workflow: true
      is_manual: false

  test_scala3:
    name: Test Scala 3
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',test_scala3,')
    uses: ./.github/workflows/_test_scala3.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  crash_recovery_test_37:
    name: Crash Recovery Test 37
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',crash_recovery_test_37,')
    uses: ./.github/workflows/_crash_recovery_test.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      issues: write
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}
      protocol_version: '37'
      job_name: crash_recovery_test_37

  nightly_cn_topology_snapshot_test_only:
    name: Nightly CN Topology Snapshot Test Only
    needs: [pick_runner, compile]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',nightly_cn_topology_snapshot_test_only,')
    uses: ./.github/workflows/_nightly_cn_topology_snapshot_test_only.yml
    secrets: inherit
    permissions:
      contents: read
      actions: write
      id-token: write
      issues: write
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  test_ping_windows:
    name: Test Ping Windows
    needs: [package_community]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',test_ping_windows,') || github.ref_type == 'tag'
    uses: ./.github/workflows/_test_ping_windows.yml
    with:
      runner: windows-latest

  test_performance_runner:
    name: Test Performance Runner
    needs: [pick_runner, package_community]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',test_performance_runner,')
    uses: ./.github/workflows/_test_performance_runner.yml
    secrets: inherit
    with:
      runner: ${{ needs.pick_runner.outputs.runner }}

  test_ping_arm:
    name: Test Ping ARM
    needs: [package_community]
    if: inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',test_ping_arm,') || github.ref_type == 'tag'
    uses: ./.github/workflows/_test_ping_arm.yml

  notify:
    name: Notify on Failure
    needs:
      - pick_runner
      - compile
      - package_community
      - package_kms_driver
      - build_scaladoc
      - build_docs_snippets
      - build_docs
      - unstable_test_36
      - unstable_test_slow_36
      - test_36_with_java17
      - test_37_with_expensive_checks
      - ledger_api_compatibility_tests_37
      - protocol_continuity_test_all
      - toxiproxy_test_slow_36
      - stability_crash_recovery_test_36
      - package_jsonapi
      - assembly_ledger_api_test_tool
      - external_parties_test_36
      - nightly_integration_test_36
      - nightly_integration_test_with_session_keys_36
      - model_based_test_36
      - postgres_conformance_test_15
      - postgres_conformance_test_16
      - postgres_conformance_test_17
      - build_and_publish_docker
      - publish_libraries
      - publish_release
      - test_scala3
      - crash_recovery_test_37
      - nightly_cn_topology_snapshot_test_only
      - test_ping_windows
      - test_performance_runner
      - test_ping_arm
      # Some jobs are left out on purpose: they ping their owners directly (fixed_volunteer), not the rota:
      # nightly_test_upgrades_matrix_and_check,
      # nightly_integration_test_36_bftordering_only,
      # stability_crash_recovery_test_alerting,
    if: |
      always() &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    uses: ./.github/workflows/_notify.yml
    secrets: inherit
    with:
      needs_json: ${{ toJSON(needs) }}
