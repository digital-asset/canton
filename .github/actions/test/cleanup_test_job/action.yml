name: Cleanup Test job
description: Cleanup Test job

inputs:
  collect_postgres_query_stats:
    default: "false" # TODO(i29772): Enable by default to collect query stats
    required: false
    description: Collect postgres query stats
  report_to_datadog:
    default: "true"
    required: false
    description: Whether cleanup should report to Datadog
  monitor_pid:
    required: true
    description: PID of Track CPU and Memory monitor
  num_test_buckets:
    description: Number of test shards
    required: false
    default: '1'
  shard_index:
    required: true
    description: Index of test shard
  test_job_success:
    required: true
    description: Whether the test job succeeded, used for reporting stability to Datadog
  job_name:
    default: ""
    required: false
    description: >-
      Distinct name of the calling leg (top-level workflow job), used to keep shard bundle
      artifacts from colliding when several legs share the same github.job (the reusable
      workflow's own job id is constant across legs). Defaults to github.job.

runs:
  using: composite
  steps:
    - name: Track CPU and Memory Stop
      if: always()
      uses: ./.github/actions/cache/store_track_cpu_and_memory
      with:
        monitor_pid: ${{ inputs.monitor_pid }}
        store: 'false'

    - name: Merge first-run and rerun JUnit results
      if: always()
      uses: ./.github/actions/nix/nix_run
      with:
        command: |
          python3 scripts/ci/test_output/merge_junit_results.py \
            --first-run-glob ".ci-test-results/first-run/**/TEST-*.xml" \
            --rerun-glob ".ci-test-results/rerun/**/TEST-*.xml" \
            --output-dir ".ci-test-results/merged" \
            --metadata-json ".ci-test-results/merged/merge-metadata.json"

    - name: Build timings.json
      if: always()
      uses: ./.github/actions/nix/nix_run
      with:
        command: |
          python3 scripts/ci/split-tests/build_timings.py \
            --junit-glob ".ci-test-results/merged/TEST-*.xml" \
            --output timings.json

    - name: Build Test Results Summary (Shard Artifact)
      if: ${{ !cancelled() }}
      uses: ./.github/actions/nix/nix_run
      with:
        command: |
          python3 scripts/ci/test_output/summarize_test_results.py \
            --shard-index "${{ inputs.shard_index }}" \
            --total-shards "${{ inputs.num_test_buckets }}" \
            --junit-glob ".ci-test-results/merged/TEST-*.xml" \
            --json-output "test-summary.json" \
            --rerun-metadata-json ".ci-test-results/merged/merge-metadata.json"

    - name: Package debug artifacts
      if: always()
      shell: bash
      run: |
        mkdir -p debug_artifacts
        cp hs_err_pid*.log debug_artifacts 2>/dev/null || true
        cp core.* debug_artifacts 2>/dev/null || true
        cp *.hprof debug_artifacts 2>/dev/null || true
        cp classpath.txt debug_artifacts 2>/dev/null || true
        cp test.classpath.txt debug_artifacts 2>/dev/null || true
        if [ "$(ls -A debug_artifacts)" ]; then
          tar czf "test-debug-artifacts-${{ github.run_id }}-${{ inputs.shard_index }}.tar.gz" debug_artifacts/
          echo "Packaged debug artifacts"
        fi

    - name: Group test reports by subproject
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        echo "::group::Group test reports by subproject"
        for subproject in `find . -path "./.ci-test-results" -prune -o -path "*/target/test-reports" -print | sed -e 's/^\.\///' -e 's/\/target\/test-reports$//'`
        do
          mkdir -p test-reports/"$subproject"
          # Keep going, if there is no test report.
          cp -v "$subproject"/target/test-reports/TEST-*.xml test-reports/"$subproject" || true
        done
        echo "::endgroup::"

    - name: Post Stability Result
      if: ${{ !cancelled() }}
      uses: ./.github/actions/cache/post_stability_result
      with:
        test_job_success: ${{ inputs.test_job_success }}

    # The CI context the flake evidence collection and the flaky pipeline below report: the
    # packages' manifest.json and the issue rows. Via $GITHUB_ENV, since step-level env does
    # not reach into the nix_run composite.
    - name: Make the CI context known to the flake evidence collection
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        {
          # The job name the pipeline reports (flaky_common.get_ci_job_name): the leg name,
          # as _test.yml already sets it, so that legs sharing github.job (e.g. the external
          # KMS legs of the crash recovery and toxiproxy tests) keep their evidence apart.
          echo "CANTON_CI_JOB_NAME=${{ env.CANTON_CI_JOB_NAME || inputs.job_name || github.job }}"
          echo "MATRIX_SHARD=${{ inputs.shard_index }}"
        } >> "$GITHUB_ENV"

    # Failure evidence for the flaky-test issues (scripts/ci/collect_flake_evidence.py):
    # evidence.json and an investigation package per failing suite. Runs before the flaky
    # pipeline below so the packages can be uploaded first and the artifact URL linked
    # from the evidence comments. A no-op on branches that do not report issues (see
    # flaky_common.should_report_issues).
    - name: Collect flake evidence
      if: |
        !cancelled() &&
        inputs.report_to_datadog == 'true' &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      uses: ./.github/actions/nix/nix_run
      with:
        command: python3 scripts/ci/collect_flake_evidence.py

    - name: Upload flake investigation packages
      id: upload_flake_pkg
      if: ${{ !cancelled() && hashFiles('flake-pkg/**') != '' }}
      uses: actions/upload-artifact@v7
      with:
        # Same shape as the shard bundle name below, so the two are easy to match up.
        name: >-
          flake-pkg-${{ inputs.job_name || github.job }}-run-${{ github.run_id
          }}-pv-${{ env.CANTON_PROTOCOL_VERSION || 'default'
          }}-shard-${{ inputs.shard_index }}-attempt-${{ github.run_attempt }}
        path: flake-pkg
        # Longer than the 7-day shard bundle: the evidence comments on the flaky issues
        # list this artifact and are read long after the failure. Keep in sync with
        # FLAKE_PKG_RETENTION_DAYS in scripts/ci/collect_flake_evidence.py.
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload test results to Datadog Test Optimization
      # Experiment (PR #35868): upload the merged per-shard JUnit reports so
      # Datadog Test Optimization can track per-test and per-suite trends and
      # flakiness. Gated on the DATADOG_TEST_OPTIMIZATION env var, set per workflow
      # so we can scope the cost experiment (on in _test.yml only to start), and
      # continue-on-error so an upload issue never reds a job. Runs on PRs too
      # (where flaky detection matters most), behind the same fork guard as the
      # failing-test step. Uses the action with a pinned datadog-ci (not in our
      # nixpkgs), avoiding a CI image rebuild.
      if: |
        !cancelled() &&
        inputs.report_to_datadog == 'true' &&
        env.DATADOG_TEST_OPTIMIZATION == 'true' &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      continue-on-error: true
      uses: datadog/junit-upload-github-action@v4.0.0
      with:
        api_key: ${{ env.DATADOG_API_KEY }}
        service: canton
        env: ci
        site: datadoghq.com
        files: .ci-test-results/merged
        tags: shard:${{ inputs.shard_index }},job:${{ github.job }}
        # Pin the datadog-ci binary the action pulls at runtime so uploads stay
        # reproducible instead of drifting with the action's floating default.
        datadog-ci-version: v5.24.1

    - name: Pack Logfiles
      if: always()
      shell: bash
      run: |
        if [[ -d log ]]; then
          find log -not -name "*.gz" -not -type d -print0 | xargs -0 -r .ci/nix-exec pigz
        fi

    - name: Dump Postgres query stats (if any)
      if: ${{ !cancelled() && inputs.collect_postgres_query_stats == 'true' }}
      uses: ./.github/actions/nix/nix_run
      with:
        command: scripts/ci/dump-pg-query-stats.sh

    - name: Prepare shard bundle contents
      if: always()
      shell: bash
      run: |
        echo "::group::Prepare shard bundle"
        mkdir -p .shard-bundle/{track,test-reports,log,timings,summary,debug,postgres}

        cp -r track/* .shard-bundle/track/ 2>/dev/null || true
        cp -r test-reports/* .shard-bundle/test-reports/ 2>/dev/null || true
        cp -r log/* .shard-bundle/log/ 2>/dev/null || true
        cp timings.json .shard-bundle/timings/timings.json 2>/dev/null || true
        cp test-summary.json .shard-bundle/summary/test-summary.json 2>/dev/null || true
        cp test-debug-artifacts-${{ github.run_id }}-${{ inputs.shard_index }}.tar.gz .shard-bundle/debug/ 2>/dev/null || true
        cp postgres-query-stats.sql.gz .shard-bundle/postgres/ 2>/dev/null || true

        find .shard-bundle -type f | sort || true
        echo "::endgroup::"

    - name: Generate shard bundle artifact name
      id: artifact_name_gen
      if: always()
      shell: bash
      env:
        JOB_NAME: ${{ inputs.job_name }}
      run: |
        # if you change this pattern, don't forget to update the download pattern in
        # _aggregate_test_shard_outputs.yml's "Download shard bundle artifacts" step
        LEG_NAME="${JOB_NAME:-${{ github.job }}}"
        NAME="${LEG_NAME}-bundle-run-${{ github.run_id }}"
        NAME="${NAME}-pv-${{ env.CANTON_PROTOCOL_VERSION || 'default' }}"
        NAME="${NAME}-shard-${{ inputs.shard_index }}"
        NAME="${NAME}-attempt-${{ github.run_attempt }}"
        echo "bundle_artifact_name=$NAME" >> $GITHUB_OUTPUT

    - name: Upload shard bundle artifact
      id: upload_shard_bundle
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.artifact_name_gen.outputs.bundle_artifact_name }}
        path: .shard-bundle
        retention-days: 7
        include-hidden-files: 'true'
        if-no-files-found: warn

    # The flaky pipeline runs after the shard bundle upload, so that the evidence comments can
    # link the bundle as well. The names, ids and URLs of the artifacts are linked with a
    # download command each (manage_flaky_issues.evidence_artifacts). The evidence itself is
    # collected earlier, before "Pack Logfiles" compresses canton_test.log.
    - name: Make flake artifacts known to the flaky pipeline
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        {
          if [[ -n "${{ steps.upload_flake_pkg.outputs.artifact-id }}" ]]; then
            # Same shape as the flake-pkg upload above, including its leg name (job_name).
            suffix="run-${{ github.run_id }}-pv-${{ env.CANTON_PROTOCOL_VERSION || 'default' }}"
            suffix="${suffix}-shard-${{ inputs.shard_index }}-attempt-${{ github.run_attempt }}"
            echo "FLAKE_PKG_ARTIFACT_NAME=flake-pkg-${{ inputs.job_name || github.job }}-${suffix}"
            echo "FLAKE_PKG_ARTIFACT_ID=${{ steps.upload_flake_pkg.outputs.artifact-id }}"
            echo "FLAKE_PKG_ARTIFACT_URL=${{ steps.upload_flake_pkg.outputs.artifact-url }}"
          fi
          if [[ -n "${{ steps.upload_shard_bundle.outputs.artifact-id }}" ]]; then
            echo "SHARD_BUNDLE_ARTIFACT_NAME=${{ steps.artifact_name_gen.outputs.bundle_artifact_name }}"
            echo "SHARD_BUNDLE_ARTIFACT_ID=${{ steps.upload_shard_bundle.outputs.artifact-id }}"
            echo "SHARD_BUNDLE_ARTIFACT_URL=${{ steps.upload_shard_bundle.outputs.artifact-url }}"
          fi
        } >> "$GITHUB_ENV"

    - name: Collect Failing Test Data And Send to Datadog
      uses: ./.github/actions/cache/collect_failing_test_data_and_send_to_datadog
      if: |
        !cancelled() &&
        inputs.report_to_datadog == 'true' &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      with:
        matrix-shard: ${{ inputs.shard_index }}
