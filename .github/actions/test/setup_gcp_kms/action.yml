name: Setup GCP/kms
description: >
  Setup GCP credentials for KMS tests.
  DACH-NY/canton and digital-asset/canton use workload identity, so the calling job needs `id-token: write`.
  Other repos, and runs without an OIDC token (e.g. Dependabot), need the GCLOUD_SERVICE_KEY
  environment variable (a GCP service account key JSON), typically via a job-level env block
  mapped from a repository secret.

runs:
  using: composite
  steps:
    - name: Choose GCP credentials for KMS
      id: mode
      shell: bash
      run: |
        if [[ "$GITHUB_REPOSITORY" != "DACH-NY/canton" && "$GITHUB_REPOSITORY" != "digital-asset/canton" ]]; then
          echo "mode=key" >> "$GITHUB_OUTPUT"
        elif [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "mode=wif" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::No OIDC token for this run, using GCLOUD_SERVICE_KEY for KMS"
          echo "mode=key" >> "$GITHUB_OUTPUT"
        fi

    - name: Authenticate to Google Cloud with workload identity
      id: auth
      if: ${{ steps.mode.outputs.mode == 'wif' }}
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: projects/638106226733/locations/global/workloadIdentityPools/gha-kms-testing/providers/gha-kms-testing-provider
        service_account: gha-kms-tester@gcp-kms-testing.iam.gserviceaccount.com
        export_environment_variables: false

    # GcpKms reads this through GoogleCredentials.getApplicationDefault()
    - name: Export workload identity credentials file
      if: ${{ steps.mode.outputs.mode == 'wif' }}
      shell: bash
      env:
        CREDENTIALS_FILE: ${{ steps.auth.outputs.credentials_file_path }}
      run: |
        echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_FILE" >> "$GITHUB_ENV"

    - name: Setup GCP credentials for KMS from the service account key
      if: ${{ steps.mode.outputs.mode == 'key' }}
      env:
        GCLOUD_SERVICE_KEY: ${{ env.GCLOUD_SERVICE_KEY }}
      run: |
        set -euo pipefail

        if [[ -z "${GCLOUD_SERVICE_KEY:-}" ]]; then
          echo "GCLOUD_SERVICE_KEY is not set or empty." >&2
          exit 1
        fi

        umask 077
        key="$(mktemp)"
        printf '%s' "${GCLOUD_SERVICE_KEY}" > "$key"
        chmod 600 "$key"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$key" >> "$GITHUB_ENV"
      shell: bash
