name: Setup GCP/kms
description: >
  Setup GCP credentials for KMS tests.
  This wrapper delegates to the generic GCP auth action with the KMS-specific WIF settings.

inputs:
  service_account_key:
    description: Service-account JSON key for key-based authentication when WIF is unavailable.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup GCP credentials for KMS
      uses: ./.github/actions/utils/setup_gcp
      with:
        service_account_key: ${{ inputs.service_account_key }}
        workload_identity_provider: projects/638106226733/locations/global/workloadIdentityPools/gha-kms-testing/providers/gha-kms-testing-provider
        service_account: gha-kms-tester@gcp-kms-testing.iam.gserviceaccount.com
