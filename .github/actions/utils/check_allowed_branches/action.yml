name: Check Allowed Branch
description: Check if current branch is in allowed list

inputs:
  allowed-branches:
    description: Comma-separated allowed branches
    required: true
    default: 'main'
  branch-name:
    description: Branch or ref name to evaluate
    required: false
    default: ''

outputs:
  branch_allowed:
    description: true if branch allowed
    value: ${{ steps.check.outputs.send }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        PROVIDED_BRANCH_NAME: ${{ inputs.branch-name }}
        CURRENT_REF_NAME: ${{ github.ref_name }}
      run: |
        BRANCHES="${{ inputs.allowed-branches }}"
        BRANCH_NAME="${PROVIDED_BRANCH_NAME:-$CURRENT_REF_NAME}"
        if printf '%s\n' "$BRANCHES" | tr ',' '\n' | grep -Fxq "$BRANCH_NAME"; then
          echo "send=true" >> $GITHUB_OUTPUT
          echo "Branch $BRANCH_NAME allowed"
        else
          echo "send=false" >> $GITHUB_OUTPUT
          echo "Branch $BRANCH_NAME not allowed [$BRANCHES]"
        fi
