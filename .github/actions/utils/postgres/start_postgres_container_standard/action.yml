name: Start Postgres Container Standard
description: Starts a Postgres container with standard configuration for testing purposes.

inputs:
  shard-index:
    description: The index of the shard for which the Postgres container is being started.
    required: true
  image:
    description: Postgres Docker image. Defaults to the base action's pinned query-stats image when empty.
    required: false
    default: ""
  enable-query-stats:
    description: Whether to start Postgres with the pg_store_plans/pg_stat_statements flags. Disable this for vanilla postgres images.
    required: false
    default: "true"


outputs:
  container-name:
    description: Started Postgres container name
    value: ${{ steps.postgres.outputs.container-name }}

runs:
  using: composite
  steps:
    - name: Export standard Postgres env
      shell: bash
      run: |
        echo "POSTGRES_DB=test" >> "$GITHUB_ENV"
        echo "POSTGRES_HOST=localhost" >> "$GITHUB_ENV"
        echo "POSTGRES_INITDB_ARGS=-A scram-sha-256" >> "$GITHUB_ENV"
        echo "POSTGRES_PASSWORD=test-password" >> "$GITHUB_ENV"
        echo "POSTGRES_PORT=5432" >> "$GITHUB_ENV"
        echo "POSTGRES_USER=test" >> "$GITHUB_ENV"

    - name: Start Postgres container
      id: postgres
      uses: ./.github/actions/utils/postgres/start_postgres_container
      with:
        shard-index: ${{ inputs.shard-index }}
        postgres-db: ${{ env.POSTGRES_DB }}
        postgres-initdb-args: ${{ env.POSTGRES_INITDB_ARGS }}
        postgres-password: ${{ env.POSTGRES_PASSWORD }}
        postgres-port: ${{ env.POSTGRES_PORT }}
        postgres-user: ${{ env.POSTGRES_USER }}
        initdb-mount-path: 'initdb-test'
        image: ${{ inputs.image }}
        enable-query-stats: ${{ inputs.enable-query-stats }}
