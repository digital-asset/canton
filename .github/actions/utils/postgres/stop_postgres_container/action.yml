name: Stop Postgres Container
description: Dump logs and stop the CI Postgres container if it exists

inputs:
  container-name:
    description: Postgres container name
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Stop Postgres container
      shell: bash
      run: |
        if [[ -n "${{ inputs.container-name }}" ]]; then
          docker logs "${{ inputs.container-name }}" || true
          docker rm -f "${{ inputs.container-name }}" || true
        fi
