name: DockerHub Login
description: Log in to DockerHub only when both username and password are provided

inputs:
  username:
    description: DockerHub username
    required: false
    default: ""
  password:
    description: DockerHub password
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check DockerHub credentials
      id: check
      shell: bash
      env:
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_PASSWORD: ${{ inputs.password }}
      run: |
        if [[ -n "$INPUT_USERNAME" && -n "$INPUT_PASSWORD" ]]; then
          echo "has_credentials=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_credentials=false" >> "$GITHUB_OUTPUT"
          echo "DockerHub credentials not provided, skipping docker login"
        fi

    - name: Login to DockerHub
      if: steps.check.outputs.has_credentials == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
