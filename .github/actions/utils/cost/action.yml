name: Compute cost
description: >
  Writes the OpenCost cost of every job in the current workflow run to the job summary.
  Use it in a final job that `needs` every other job of the workflow, runs on an ARC runner
  in a cluster running OpenCost, and has `actions: read`.

inputs:
  github_token:
    description: >-
      Token used to list the run's jobs through the GitHub API. Needs `actions: read`.
      Defaults to the workflow's or job's GH_TOKEN env if set, otherwise to the job's github.token.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Make GH_TOKEN available to the nix_run composite
      shell: bash
      env:
        TOKEN: ${{ inputs.github_token || env.GH_TOKEN || github.token }}
      run: echo "GH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

    # gh is not on the runner image: it comes from the repo's nix shell.
    - name: Compute cost
      uses: ./.github/actions/nix/nix_run
      with:
        command: bash "${{ github.action_path }}/compute_cost.sh"
