name: Check TODOs/FIXMEs
description: Scan codebase for open TODO/FIXME/HACK comments (Canton replacement) and their associated tickets

outputs:
  todo-count:
    description: Number of TODOs found
    value: ${{ steps.check.outputs.result }}

runs:
  using: composite
  steps:
    - id: check
      uses: ./.github/actions/nix/nix_run
      with:
        command: ./scripts/ci/run-todo-script.sh
        output-name: count
      env:
        GITHUB_TOKEN: ${{ github.token }}
