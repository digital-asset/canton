name: Setup GCP credentials for GAR
description: Authenticate to GCP with workload identity for publishing to da-images, and export the credentials file for sbt

outputs:
  access_token:
    description: Short-lived access token for Google Artifact Registry
    value: ${{ steps.auth.outputs.access_token }}

runs:
  using: composite
  steps:
    - name: Check the repository has a workload identity provider
      if: ${{ github.repository != 'DACH-NY/canton' && github.repository != 'digital-asset/canton' }}
      shell: bash
      run: |
        echo "::error::No workload identity provider for ${GITHUB_REPOSITORY}, add one in setup_gcp_gar"
        exit 1

    # Each repo has its own provider and service account. The calling job needs `id-token: write`.
    - name: Authenticate to Google Cloud with workload identity
      id: auth
      uses: google-github-actions/auth@v3
      with:
        token_format: access_token
        workload_identity_provider: >-
          ${{
            github.repository == 'DACH-NY/canton' && 'projects/794775982379/locations/global/workloadIdentityPools/github-actions/providers/dny-provider' ||
            github.repository == 'digital-asset/canton' && 'projects/794775982379/locations/global/workloadIdentityPools/github-actions/providers/da-provider' ||
            ''
          }}
        service_account: >-
          ${{
            github.repository == 'DACH-NY/canton' && 'gh-dny-canton@da-images.iam.gserviceaccount.com' ||
            github.repository == 'digital-asset/canton' && 'gh-da-canton@da-images.iam.gserviceaccount.com' ||
            ''
          }}

    - name: Export credentials file for sbt
      shell: bash
      env:
        CREDENTIALS_FILE: ${{ steps.auth.outputs.credentials_file_path }}
      run: |
        echo "GOOGLE_CREDENTIALS_FILE=$CREDENTIALS_FILE" >> "$GITHUB_ENV"
