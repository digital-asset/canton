name: Restore SBT cache
description: Restore Ivy and SBT caches

outputs:
  ivy-cache-hit:
    description: Whether ivy cache had an exact hit
    value: ${{ steps.restore_ivy.outputs.cache-hit }}
  ivy-cache-matched-key:
    description: Restored ivy cache key
    value: ${{ steps.restore_ivy.outputs.cache-matched-key }}
  sbt-cache-hit:
    description: Whether sbt cache had an exact hit
    value: ${{ steps.restore_sbt.outputs.cache-hit }}
  sbt-cache-matched-key:
    description: Restored sbt cache key
    value: ${{ steps.restore_sbt.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - name: Resolve ref
      id: resolve_ref
      uses: ./.github/actions/utils/resolve_ref

    - name: Compute build hash
      id: compute_hash
      uses: ./.github/actions/cache/compute_build_hash

    - name: Obtain latest base branch git commit sha
      id: compute_base_sha
      shell: bash
      run: |
        echo "base_sha=$(git rev-parse "origin/${BASE_BRANCH}")" >> "$GITHUB_OUTPUT"
      env:
        BASE_BRANCH: ${{ steps.resolve_ref.outputs.base_branch }}

    # [TEST ONLY] sbt resolves through coursier since sbt 1.3, so ~/.ivy2/cache stayed empty
    # (the saved archive was 194 bytes) and every job fetched every jar again. Cache the
    # coursier cache instead. The `ivy-*` step id and outputs keep their names so callers are
    # unchanged; the key prefix is new so old ivy archives are not restored into it.
    - name: Locate coursier cache
      id: coursier_dir
      shell: bash
      run: echo "dir=${COURSIER_CACHE:-$HOME/.cache/coursier}" >> "$GITHUB_OUTPUT"

    - name: Reset local dependency caches before restore
      shell: bash
      run: |
        rm -rf "${COURSIER_DIR}" ~/.sbt
        mkdir -p "${COURSIER_DIR}" ~/.sbt
      env:
        COURSIER_DIR: ${{ steps.coursier_dir.outputs.dir }}

    - name: Restore coursier cache
      id: restore_ivy
      uses: ./.github/actions/cache/restore_cache
      with:
        path: ${{ steps.coursier_dir.outputs.dir }}
        key: >-
          sbt-coursier-os=${{ runner.os }}-branch=${{ steps.resolve_ref.outputs.ref_group_key }}-hash=${{ steps.compute_hash.outputs.hash }}-sha=${{ github.sha }}
        restore-keys: |-
          sbt-coursier-os=${{ runner.os }}-branch=${{ steps.resolve_ref.outputs.ref_group_key }}-hash=${{ steps.compute_hash.outputs.hash }}-sha=
          sbt-coursier-os=${{ runner.os }}-branch=branch-${{ steps.resolve_ref.outputs.base_branch }}-hash=${{ steps.compute_hash.outputs.hash }}-sha=${{ steps.compute_base_sha.outputs.base_sha }}
          sbt-coursier-os=${{ runner.os }}-branch=branch-${{ steps.resolve_ref.outputs.base_branch }}-hash=${{ steps.compute_hash.outputs.hash }}-sha=

    - name: Restore SBT cache
      id: restore_sbt
      uses: ./.github/actions/cache/restore_cache
      with:
        path: ~/.sbt/
        key: >-
          sbt-home-os=${{ runner.os }}-branch=${{ steps.resolve_ref.outputs.ref_group_key }}-hash=${{ steps.compute_hash.outputs.hash }}-sha=${{ github.sha }}
        restore-keys: |-
          sbt-home-os=${{ runner.os }}-branch=${{ steps.resolve_ref.outputs.ref_group_key }}-hash=${{ steps.compute_hash.outputs.hash }}-sha=
          sbt-home-os=${{ runner.os }}-branch=branch-${{ steps.resolve_ref.outputs.base_branch }}-hash=${{ steps.compute_hash.outputs.hash }}-sha=${{ steps.compute_base_sha.outputs.base_sha }}
          sbt-home-os=${{ runner.os }}-branch=branch-${{ steps.resolve_ref.outputs.base_branch }}-hash=${{ steps.compute_hash.outputs.hash }}-sha=
