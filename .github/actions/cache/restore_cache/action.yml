name: Restore cache
description: Restore cache

inputs:
  path:
    description: Cache paths (multiline)
    required: true
  key:
    description: Primary cache key
    required: true
  restore-keys:
    description: Restore keys (multiline)
    required: false
    default: ''

outputs:
  cache-hit:
    description: Cache hit status
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: Primary cache key used
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-matched-key:
    description: Key of the cache that was restored
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - name: Restore cache
      id: restore
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
