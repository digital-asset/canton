name: Docker Log Into GCR
description: Docker login to Google Cloud Artifact Registry (GCR) with workload identity.

inputs:
  oci_registry:
    description: OCI registry hostname
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      id: gcp
      uses: ./.github/actions/publish/setup_gcp_gar

    - name: Log Docker into GCR
      shell: bash
      env:
        OCI_REGISTRY: ${{ inputs.oci_registry }}
        ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
      run: |
        echo "Logging Docker in to $OCI_REGISTRY..."
        printf '%s\n' "$ACCESS_TOKEN" | \
          docker login -u oauth2accesstoken --password-stdin "https://$OCI_REGISTRY" >/dev/null
