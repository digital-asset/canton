# Classification of every canton_build_required job for the red-main Slack alert.
# Single source of truth shared by _notify.yml (alerts on non-test failures) and
# check_canton_build_required_gate.py (fails CI if a job is left unclassified, so
# this list cannot drift from the workflow).
#
# test_jobs: failures are NOT alerted here. The flaky pipeline
#   (report_failing_tests.py -> manage_flaky_issues.py -> alert_slack.py) tracks
#   them as `[main] Flaky <test>` issues and pings the Flaky Canton rota.
# infra_jobs: build/infra failures that block main and ARE alerted here.
#
# `notify`, `ci_costs` and `canton_build_required_gate` are excluded (they report
# status or cost, not build health), like the guard excludes them from the
# aggregators' `needs`.
test_jobs:
  - test_36
  - test_37
  - test_37_requires_external_kms
  - test_dev
  - ledger_api_compatibility_tests_37
  - protocol_continuity_test_latest
  - smoke_test
  - test_data_continuity_dumps
  - toxiproxy_test_fast_37
  - toxiproxy_test_fast_37_requires_external_kms
  - unstable_test_37
  - variations_test_37
  - variations_test_37_selected_users
  - crash_recovery_test_37
  - crash_recovery_test_37_requires_external_kms
infra_jobs:
  - pick_runner
  - plan_ci
  - setup_and_validation
  - static_tests
  - compile
  - build_docs
  - build_docs_snippets
  - build_scaladoc
  - package_community
  - protobuf_continuity
  - size_config_up_to_date
  - scalafix
  # Image build + compose ping smoke test, not run_tests/cleanup_test_job, so its
  # failures never reach the flaky pipeline and would be silent if not alerted.
  - test_docker_images

  # Pull-request only: publishes PV37 results for later runs of the same PR head to reuse.
  # It never runs on main, so it never alerts; listed only so every job is classified.
  - publish_draft_results
